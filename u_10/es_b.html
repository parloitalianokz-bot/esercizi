<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unità 10 — Completamento Desinenze</title>
  <style>
    :root {
      color-scheme: light;
      font-family: 'Segoe UI', Inter, system-ui, -apple-system, sans-serif;
      --primary: #6556bd;
      --primary-light: #f0edff;
      --primary-dark: #4c3e99;
      --accent: #ffb703;
      --bg-main: #f7f6fb;
      --card-bg: #ffffff;
      --text: #24213a;
      --text-muted: #68667a;
      --success: #20a16b;
      --success-bg: #d9f4e8;
      --border: #ebe9f2;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 16px;
      background:
        radial-gradient(ellipse at 50% -12%, rgba(155, 142, 240, .24), transparent 42%),
        var(--bg-main);
      color: var(--text);
    }

    .container { width: min(100%, 760px); margin: 0 auto; }

    .hero { margin: 8px 0 28px; text-align: center; }
    .eyebrow {
      display: inline-block;
      color: var(--primary);
      font-size: .8rem;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      background: var(--primary-light);
      padding: 7px 14px;
      border-radius: 20px;
      margin-bottom: 8px;
      box-shadow: inset 0 0 0 1px rgba(101, 86, 189, .08);
    }
    h1 {
      margin: 4px 0;
      font-size: clamp(2rem, 5vw, 2.6rem);
      letter-spacing: -.03em;
      color: var(--primary-dark);
      line-height: 1.15;
    }
    .hero-subtitle {
      margin: 8px 0 0;
      color: var(--text-muted);
      font-size: .98rem;
    }

    /* Barra controlli superiore */
    .top-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-start;
      gap: 12px;
      margin-bottom: 24px;
      padding: 14px 20px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--card-bg);
      box-shadow: 0 6px 18px rgba(50, 38, 94, .04);
    }
    .teacher-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
    }
    .teacher-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: .88rem;
      color: var(--text);
      cursor: pointer;
      font-weight: 600;
      user-select: none;
    }
    .teacher-toggle input { accent-color: var(--primary); }
    
    button.reset-btn {
      padding: 6px 14px;
      border: 1px solid #fca5a5;
      border-radius: 10px;
      background: #fff;
      color: #dc2626;
      font: inherit;
      font-size: .8rem;
      font-weight: 700;
      cursor: pointer;
      min-height: 42px;
    }
    button.reset-btn:hover { background: #fef2f2; }

    /* Card Esercizio */
    .card {
      padding: clamp(20px, 4vw, 32px);
      border: 1px solid var(--border);
      border-radius: 26px;
      background: var(--card-bg);
      box-shadow: 0 20px 55px rgba(50, 38, 94, .08);
    }

    .phrase-box {
      position: relative;
      overflow: hidden;
      padding: 22px;
      margin-bottom: 22px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: #fff;
      transition: all .25s ease;
      box-shadow: 0 5px 16px rgba(50, 38, 94, .035);
      line-height: 2.2;
      font-size: 1.05rem;
    }
    .phrase-box.active {
      border-color: #8b7ce0;
      background: linear-gradient(145deg, #fff 55%, #faf9ff);
      box-shadow: 0 0 0 3px rgba(101, 86, 189, .11), 0 10px 24px rgba(50, 38, 94, .06);
    }
    .phrase-box.active::before,
    .phrase-box.approved::before {
      position: absolute;
      inset: 0 auto 0 0;
      width: 5px;
      background: var(--primary);
      content: "";
    }
    .phrase-box.approved::before { background: var(--success); }
    .phrase-box.locked { background: #fbfaff; opacity: .7; }
    .phrase-box.approved {
      border-color: #d1fae5;
      background: #f0fdf4;
    }

    .phrase-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      line-height: 1;
    }
    .number {
      display: inline-grid;
      width: 36px;
      height: 36px;
      place-items: center;
      border-radius: 12px;
      background: var(--primary-light);
      color: var(--primary);
      font-size: .95rem;
      font-weight: 800;
    }
    .badge {
      font-size: .75rem;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 8px;
      text-transform: uppercase;
      letter-spacing: .015em;
    }
    .badge-locked { background: #e5e7eb; color: #6b7280; }
    .badge-active { background: #ffe4e6; color: #e11d48; }
    .badge-writing { background: #fef3c7; color: #d97706; }
    .badge-approved { background: var(--success-bg); color: #047857; }

    /* Stile Input Desinenze inline con feedback cromatico */
    input.ending-input {
      display: inline-block;
      width: 54px;
      padding: 2px 6px;
      margin: 0 2px;
      border: 1.5px solid #d9d3ed;
      border-radius: 8px;
      font: inherit;
      font-size: 1rem;
      font-weight: 700;
      color: var(--primary-dark);
      text-align: center;
      background: #fff;
      transition: all .2s ease;
    }
    input.ending-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(101, 86, 189, 0.15);
      outline: none;
    }
    /* Stato Corretto (Verde) */
    input.ending-input.correct {
      border-color: #15803d !important;
      background-color: #dcfce7 !important;
      color: #166534 !important;
      box-shadow: inset 0 0 0 1px #15803d;
    }
    /* Stato Errato (Rosso) */
    input.ending-input.incorrect {
      border-color: #dc2626 !important;
      background-color: #fee2e2 !important;
      color: #991b1b !important;
      box-shadow: inset 0 0 0 1px #dc2626;
    }
    input.ending-input:disabled {
      cursor: not-allowed;
      opacity: .85;
    }

    /* Controlli Token */
    .token-controls {
      margin-top: 14px;
      display: flex;
      justify-content: flex-start;
      align-items: center;
    }
    .btn-token {
      background: var(--accent);
      color: #24213a;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 700;
      font-size: .85rem;
      cursor: pointer;
      min-height: 42px;
      transition: background 0.2s;
    }
    .btn-token:hover { background: #e0a200; }
    .btn-token.release {
      background: #e2e8f0;
      color: #475569;
    }

    /* Azione Unica Insegnante */
    .teacher-action {
      margin-top: 16px;
      display: flex;
      justify-content: flex-end;
    }
    .btn-approve {
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 12px;
      font-weight: 700;
      max-width: 100%;
      line-height: 1.4;
      font-size: .9rem;
      cursor: pointer;
      min-height: 42px;
      box-shadow: 0 4px 12px rgba(101, 86, 189, 0.2);
      transition: transform 0.15s, background 0.2s;
    }
    .btn-approve:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    @media (max-width: 520px) {
      body { padding: 16px 8px; }
      .top-controls { flex-direction: column; align-items: flex-start; }
      .teacher-controls { width: 100%; justify-content: space-between; }
      .card { padding: 18px 14px; border-radius: 20px; }
      .phrase-box { padding: 16px 13px; border-radius: 16px; font-size: .98rem; }
      input.ending-input { width: 46px; }
      .badge { font-size: .68rem; padding: 5px 7px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>

  <main class="container">
    <header class="hero">
      <span class="eyebrow">Unità 10 · Grammatica</span>
      <h1>Добавьте окончания слов</h1>
      <p class="hero-subtitle">Aggiungi le desinenze delle parole</p>
    </header>

    <!-- Barra Controlli Superiore -->
    <div id="status" class="top-controls">
      <div class="teacher-controls">
        <label class="teacher-toggle">
          <input type="checkbox" id="teacher-mode">
          Режим учителя · Modalità insegnante
        </label>
        <button id="reset" class="reset-btn" type="button" style="display:none;">⚠️ Сбросить · Azzera</button>
      </div>
    </div>

    <!-- Card dell'Esercizio -->
    <section class="card">
      <form id="answers" autocomplete="off"></form>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "INSERISCI_API_KEY",
      authDomain: "esercizi-parlo-italiano.firebaseapp.com",
      databaseURL: "https://esercizi-parlo-italiano-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "esercizi-parlo-italiano",
      appId: "INSERISCI_APP_ID"
    };

    // Struttura delle frasi con segnaposto "_"
    const phrases = [
      "Buongiorno, avete una borsa? Una borsa piccol_ e ross_? - Mi dispiace, ma non abbiamo borse piccol_ e ross_.",
      "— Bene. Forse allora avete una borsa ross_ grand_, non piccol_? — Mi dispiace, Signora, ma non abbiamo borse ross_: nè grand_ nè piccol_.",
      "— E una borsa ross_ normal_, nè grand_ nè piccol_? — Mi dispiace, non abbiamo borse ross_: nè grand_, nè piccol_, nè normal_.",
      "Alla fine, la signora decide di fare la spesa. Compra un pomodoro, piccol_ e ross_, un peperone, piccol_ e ross_, e una mela, piccol_ e ross_. Compra anche un chilo di ciliegie, piccol_ e ross_.",
      "Buongiorno, avete una borsa? Una borsa piccol_ e ross_? Mi dispiace, Signora, non abbiamo borse piccol_ e ross_ in questo momento.",
      "Peccato! Allora forse avete una borsa grand_ e bianc_? Sì, abbiamo molte borse grand_ e bianch_.",
      "La stess_ borsa c'è anche marron_, ner_, bianc_, giall_ e verd_. Preferisco il colore ross_."
    ];

    // Risposte corrette corrispondenti a ciascuna desinenza
    const correctEndings = [
      ["a", "a", "e", "e"],
      ["a", "e", "a", "e", "i", "e"],
      ["a", "e", "e", "a", "e", "i", "e", "i"],
      ["o", "o", "o", "o", "a", "a", "e", "e"],
      ["a", "a", "e", "e"],
      ["e", "a", "i", "e"],
      ["a", "e", "a", "a", "a", "e", "o"]
    ];

    const myClientId = "user_" + Math.random().toString(36).substring(2, 9);

    const form = document.getElementById("answers");
    const teacherToggle = document.getElementById("teacher-mode");
    const resetButton = document.getElementById("reset");

    let answersRef = null;
    let currentActiveStep = -1;
    let currentWriter = null;
    let isTeacher = false;

    const phraseBoxes = [];
    const badges = [];

    phrases.forEach((phraseText, phraseIdx) => {
      const row = document.createElement("div");
      row.className = "phrase-box locked";
      row.id = `phrase-${phraseIdx}`;

      const header = document.createElement("div");
      header.className = "phrase-header";

      const numSpan = document.createElement("span");
      numSpan.className = "number";
      numSpan.textContent = phraseIdx + 1;

      const badge = document.createElement("span");
      badge.className = "badge badge-locked";
      badge.textContent = "Закрыта · Bloccata";

      header.append(numSpan, badge);
      row.appendChild(header);

      const parts = phraseText.split("_");
      const contentSpan = document.createElement("span");

      parts.forEach((part, inputIdx) => {
        contentSpan.appendChild(document.createTextNode(part));
        
        if (inputIdx < parts.length - 1) {
          const input = document.createElement("input");
          input.type = "text";
          input.className = "ending-input";
          input.dataset.phrase = phraseIdx;
          input.dataset.input = inputIdx;
          input.disabled = true;

          input.addEventListener("input", () => {
            if (answersRef && currentActiveStep === phraseIdx && currentWriter === myClientId) {
              answersRef.child("responses").child(String(phraseIdx)).child(String(inputIdx)).set(input.value.trim().toLowerCase());
            }
          });

          contentSpan.appendChild(input);
        }
      });

      row.appendChild(contentSpan);

      const tokenDiv = document.createElement("div");
      tokenDiv.className = "token-controls";
      tokenDiv.style.display = "none";

      const tokenBtn = document.createElement("button");
      tokenBtn.className = "btn-token";
      tokenBtn.type = "button";
      tokenBtn.textContent = "✋ Взять слово · Prendi la parola";
      tokenBtn.onclick = () => {
        if (answersRef && currentActiveStep === phraseIdx) {
          if (currentWriter === myClientId) {
            answersRef.child("currentWriter").set(null);
          } else if (!currentWriter) {
            answersRef.child("currentWriter").set(myClientId);
          }
        }
      };

      tokenDiv.appendChild(tokenBtn);

      const actionDiv = document.createElement("div");
      actionDiv.className = "teacher-action";
      actionDiv.style.display = "none";

      const actionBtn = document.createElement("button");
      actionBtn.className = "btn-approve";
      actionBtn.type = "button";
      actionBtn.textContent = "🔓 Открыть блок · Sblocca Blocco";
      actionBtn.onclick = () => {
        if (answersRef) {
          if (currentActiveStep === phraseIdx) {
            answersRef.update({
              activeStep: phraseIdx + 1,
              currentWriter: null
            });
          } else {
            answersRef.update({
              activeStep: phraseIdx,
              currentWriter: null
            });
          }
        }
      };

      actionDiv.appendChild(actionBtn);
      row.append(tokenDiv, actionDiv);

      form.appendChild(row);
      phraseBoxes.push(row);
      badges.push(badge);
    });

    teacherToggle.addEventListener("change", (e) => {
      isTeacher = e.target.checked;
      resetButton.style.display = isTeacher ? "inline-block" : "none";
      updateUIState();
    });

    let currentResponsesData = {};

    function updateUIState() {
      phraseBoxes.forEach((box, i) => {
        const badge = badges[i];
        const inputs = box.querySelectorAll("input.ending-input");
        const tokenDiv = box.querySelector(".token-controls");
        const tokenBtn = box.querySelector(".btn-token");
        const actionDiv = box.querySelector(".teacher-action");
        const actionBtn = box.querySelector(".btn-approve");

        box.classList.remove("active", "locked", "approved");

        if (i < currentActiveStep) {
          // Blocco Approvato
          box.classList.add("approved");
          badge.className = "badge badge-approved";
          badge.textContent = "Одобрено · Approvata";
          inputs.forEach(inp => inp.disabled = true);
          tokenDiv.style.display = "none";
          actionDiv.style.display = "none";
        } else if (i === currentActiveStep) {
          // Blocco Attivo (Sbloccato)
          box.classList.add("active");

          if (!currentWriter) {
            badge.className = "badge badge-active";
            badge.textContent = "Открыто · In corso";
            inputs.forEach(inp => inp.disabled = true);

            tokenDiv.style.display = "flex";
            tokenBtn.textContent = "✋ Взять слово · Prendi la parola";
            tokenBtn.className = "btn-token";
            tokenBtn.disabled = false;
          } else if (currentWriter === myClientId) {
            badge.className = "badge badge-writing";
            badge.textContent = "Вы пишете · Stai scrivendo";
            inputs.forEach(inp => inp.disabled = false);

            tokenDiv.style.display = "flex";
            tokenBtn.textContent = "✔ Передать слово · Lascia la parola";
            tokenBtn.className = "btn-token release";
            tokenBtn.disabled = false;
          } else {
            badge.className = "badge badge-writing";
            badge.textContent = "Пишет одноклассник · Un compagno sta scrivendo";
            inputs.forEach(inp => inp.disabled = true);

            tokenDiv.style.display = "flex";
            tokenBtn.textContent = "🔒 Пишет одноклассник · Un compagno sta scrivendo";
            tokenBtn.className = "btn-token release";
            tokenBtn.disabled = true;
          }

          if (isTeacher) {
            actionDiv.style.display = "flex";
            actionBtn.textContent = "✔️ Одобрить и открыть следующий · Approva e apri il successivo ➔";
          } else {
            actionDiv.style.display = "none";
          }
        } else {
          // Blocco Bloccato
          box.classList.add("locked");
          badge.className = "badge badge-locked";
          badge.textContent = "Закрыта · Bloccata";
          inputs.forEach(inp => inp.disabled = true);
          tokenDiv.style.display = "none";

          if (isTeacher && i === currentActiveStep + 1) {
            actionDiv.style.display = "flex";
            actionBtn.textContent = i === 0
              ? "🔓 Открыть первый блок · Sblocca il primo blocco"
              : "🔓 Открыть этот блок · Sblocca questo blocco";
          } else {
            actionDiv.style.display = "none";
          }
        }

        // Controllo automatico correttezza (Verde/Rosso)
        inputs.forEach((input, inputIdx) => {
          const userVal = (input.value || "").trim().toLowerCase();
          const targetEnding = correctEndings[i][inputIdx];

          input.classList.remove("correct", "incorrect");

          if (userVal !== "") {
            if (userVal === targetEnding) {
              input.classList.add("correct");
            } else {
              input.classList.add("incorrect");
            }
          }
        });
      });
    }

    if (window.firebase) {
      try {
        firebase.initializeApp(firebaseConfig);
        answersRef = firebase.database().ref("esercizi/unita10-desinenze");

        answersRef.on("value", (snapshot) => {
          const data = snapshot.val() || {};
          currentResponsesData = data.responses || {};

          currentActiveStep = (data.activeStep !== undefined) ? data.activeStep : -1;
          currentWriter = data.currentWriter || null;

          phraseBoxes.forEach((box, pIdx) => {
            const inputs = box.querySelectorAll("input.ending-input");
            const phraseData = currentResponsesData[pIdx] || {};

            inputs.forEach((input, iIdx) => {
              if (currentWriter !== myClientId) {
                input.value = phraseData[iIdx] || "";
              }
            });
          });

          updateUIState();
        });
      } catch (e) {
        console.error("Errore Firebase:", e);
      }
    }

    resetButton.addEventListener("click", () => {
      if (confirm("Сбросить все ответы и снова заблокировать упражнение? · Vuoi azzerare tutte le risposte e bloccare nuovamente l'esercizio?")) {
        answersRef.set({
          activeStep: -1,
          currentWriter: null,
          responses: {}
        });
      }
    });
  </script>
</body>
</html>
