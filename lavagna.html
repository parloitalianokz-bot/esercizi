<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lavagna di Testo Condivisa a Turni 📝</title>
    <style>
        :root {
            --primary: #4CAF50;
            --accent: #FF5722;
            --bg: #2d3748;
            --panel-bg: #1a202c;
        }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: var(--bg); 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        
        .toolbar {
            background: var(--panel-bg);
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            z-index: 10;
            flex-wrap: wrap;
            gap: 10px;
        }
        .toolbar h1 { font-size: 1.2rem; margin: 0; color: #e2e8f0; }
        
        .status-badge { padding: 8px 15px; border-radius: 20px; font-weight: bold; font-size: 0.9rem; background: #4a5568; }
        .status-writing { background: #cbd5e0; color: #1a202c; }
        
        .action-buttons { display: flex; gap: 10px; }
        
        button { padding: 10px 18px; font-size: 14px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; transition: all 0.2s; }
        .btn-write { background: var(--primary); color: white; }
        .btn-spectate { background: #2196F3; color: white; }
        .btn-print { background: #9c27b0; color: white; } /* Colore viola per il tasto stampa */
        .btn-clear { background: var(--accent); color: white; }
        button:hover { opacity: 0.9; }
        button:disabled { background: #4a5568; color: #718096; cursor: not-allowed; }
        
        .text-container { 
            flex: 1; 
            padding: 25px; 
            box-sizing: border-box; 
            background: #3a475d; 
            overflow-y: auto; 
        }
        
        .editable-board {
            width: 100%;
            min-height: 100%;
            padding: 25px;
            font-size: 20px;
            line-height: 1.6;
            border-radius: 8px;
            border: 2px solid #4a5568;
            background: #ffffff;
            color: #2d3748;
            box-sizing: border-box;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            white-space: pre-wrap; 
            word-wrap: break-word;
        }
        .editable-board:focus { outline: none; border-color: var(--primary); }
        .editable-board[contenteditable="false"] {
            background: #f0f2f5;
            color: #4a5568;
            cursor: not-allowed;
        }

        .editable-board:empty:before {
            content: attr(data-placeholder);
            color: #718096;
            font-style: italic;
        }

        /* ==========================================
           🖨️ REGOLE DI STAMPA PERFETTE MULTIPAGINA
           ========================================== */
        @media print {
            html, body { height: auto !important; overflow: visible !important; background: white; color: black; }
            body { display: block; }
            .toolbar { display: none !important; }
            .text-container { padding: 0 !important; background: white !important; height: auto !important; overflow: visible !important; }
            .editable-board { 
                border: none !important; 
                box-shadow: none !important; 
                width: 100% !important; 
                height: auto !important; 
                overflow: visible !important; 
                background: transparent !important; 
                padding: 0 !important;
                font-size: 14pt !important;
            }
        }
    </style>
</head>
<body>

<div class="toolbar">
    <h1>📝 Lavagna Unica di Classe Live</h1>
    <div id="statusIndicator" class="status-badge">Stato: Nessuno sta scrivendo (Lavagna Libera) 🟢</div>
    <div class="action-buttons">
        <button id="btnWrite" class="btn-write" onclick="takeMarker()">Prendi il Pennarello ✍️</button>
        <button id="btnSpectate" class="btn-spectate" onclick="releaseMarker()" style="display:none;">Lascia il Pennarello (Fatto!) 👁️</button>
        
        <button class="btn-print" onclick="window.print()">Stampa in PDF 🖨️</button>
        
        <button class="btn-clear" onclick="clearBoard()">Cancella Lavagna 🧹</button>
    </div>
</div>

<div class="text-container">
    <div id="sharedMainText" class="editable-board" contenteditable="false" data-placeholder="Usa i pulsanti in alto per prendere il controllo della lavagna e iniziare a scrivere..."></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        databaseURL: "https://esercizi-parlo-italiano-default-rtdb.europe-west1.firebasedatabase.app/"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const sessionRef = ref(db, "ricette_parlare/lavagna_singola_turni");

    const sharedMainText = document.getElementById('sharedMainText');
    const statusIndicator = document.getElementById('statusIndicator');
    const btnWrite = document.getElementById('btnWrite');
    const btnSpectate = document.getElementById('btnSpectate');

    const mySessionId = "user_" + Math.random().toString(36).substr(2, 9);
    let currentWriter = ""; 
    let currentText = "";

    onValue(sessionRef, (snapshot) => {
        const data = snapshot.val() || {};
        currentWriter = data.writer || "";
        currentText = data.text || "";

        if (currentWriter !== mySessionId) {
            sharedMainText.innerText = currentText;
        }

        if (currentWriter === "") {
            statusIndicator.innerHTML = "Stato: Lavagna Libera 🟢";
            statusIndicator.className = "status-badge";
            sharedMainText.setAttribute("contenteditable", "false");
            btnWrite.style.display = "inline-block";
            btnWrite.disabled = false;
            btnSpectate.style.display = "none";
        } else if (currentWriter === mySessionId) {
            statusIndicator.innerHTML = "Stato: Stai scrivendo tu! ✍️ 🔥";
            statusIndicator.className = "status-badge status-writing";
            sharedMainText.setAttribute("contenteditable", "true");
            btnWrite.style.display = "none";
            btnSpectate.style.display = "inline-block";
            sharedMainText.focus();
        } else {
            statusIndicator.innerHTML = "Stato: Un compagno sta scrivendo... ⏳ 👁️";
            statusIndicator.className = "status-badge";
            sharedMainText.setAttribute("contenteditable", "false");
            btnWrite.style.display = "inline-block";
            btnWrite.disabled = true; 
            btnSpectate.style.display = "none";
        }
    });

    sharedMainText.addEventListener('input', () => {
        if (currentWriter === mySessionId) {
            set(ref(db, "ricette_parlare/lavagna_singola_turni/text"), sharedMainText.innerText);
        }
    });

    window.takeMarker = function() {
        if (currentWriter === "") {
            set(ref(db, "ricette_parlare/lavagna_singola_turni/writer"), mySessionId);
        }
    };

    window.releaseMarker = function() {
        if (currentWriter === mySessionId) {
            sharedMainText.blur();
            set(ref(db, "ricette_parlare/lavagna_singola_turni/writer"), "");
        }
    };

    window.clearBoard = function() {
        if (confirm("Vuoi davvero svuotare l'intera lavagna per tutti?")) {
            const emptySession = { writer: "", text: "" };
            set(sessionRef, emptySession).then(() => {
                sharedMainText.innerText = "";
            });
        }
    };
</script>
</body>
</html>
