<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lavagna di Testo Condivisa 📝</title>
    <style>
        :root {
            --primary: #4CAF50;
            --accent: #FF5722;
            --bg: #2d3748;
            --panel-bg: #1a202c;
            
            /* Colori correzione metodologica */
            --mark-green: #c6f6d5;
            --mark-yellow: #fefcbf;
            --mark-red: #fed7d7;
        }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: var(--bg); 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        
        .toolbar {
            background: var(--panel-bg);
            padding: 15px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            z-index: 10;
        }
        .toolbar-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }
        .toolbar h1 { font-size: 1.2rem; margin: 0; color: #e2e8f0; }
        
        .status-badge { padding: 8px 15px; border-radius: 20px; font-weight: bold; font-size: 0.9rem; background: #4a5568; user-select: none; }
        .status-writing { background: #cbd5e0; color: #1a202c; }
        
        .action-buttons { display: flex; gap: 10px; flex-wrap: wrap; }
        
        button { padding: 10px 18px; font-size: 14px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; transition: all 0.2s; }
        .btn-write { background: var(--primary); color: white; }
        .btn-spectate { background: #2196F3; color: white; }
        .btn-print { background: #9c27b0; color: white; }
        .btn-unlock { background: #00bcd4; color: white; } 
        .btn-clear { background: var(--accent); color: white; }
        button:hover { opacity: 0.9; }
        button:disabled { background: #4a5568; color: #718096; cursor: not-allowed; }
        
        /* Sezione Audio & Evidenziatori */
        .tools-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #2d3748;
            padding: 8px 12px;
            border-radius: 6px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .audio-panel { display: flex; align-items: center; gap: 10px; }
        .audio-panel input[type="file"] { display: none; }
        .btn-file { background: #4a5568; color: white; font-size: 12px; padding: 6px 12px; }
        audio { height: 32px; }

        .marker-palette { display: flex; gap: 8px; align-items: center; font-size: 0.9rem; }
        .marker { width: 32px; height: 32px; border-radius: 50%; border: 2px solid #ffffff; cursor: pointer; transition: transform 0.1s; }
        .marker:hover { transform: scale(1.1); }
        .m-green { background: var(--mark-green); }
        .m-yellow { background: var(--mark-yellow); }
        .m-red { background: var(--mark-red); }
        .m-clear { background: #ffffff; border: 2px dashed #e2e8f0; display: flex; align-items: center; justify-content: center; color: #333; font-size: 14px; }

        .text-container { 
            flex: 1; 
            padding: 25px; 
            box-sizing: border-box; 
            background: #3a475d; 
            overflow-y: auto; 
        }
        
        .editable-board {
            width: 100%;
            min-height: 100%;
            padding: 25px;
            font-size: 20px;
            line-height: 1.6;
            border-radius: 8px;
            border: 2px solid #4a5568;
            background: #ffffff;
            color: #2d3748;
            box-sizing: border-box;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            white-space: pre-wrap; 
            word-wrap: break-word;
        }
        .editable-board:focus { outline: none; border-color: var(--primary); }
        .editable-board[contenteditable="false"] {
            background: #f0f2f5;
            color: #4a5568;
        }

        .editable-board:empty:before {
            content: attr(data-placeholder);
            color: #718096;
            font-style: italic;
        }

        /* Definizioni per i colori di evidenziazione inseriti via execCommand */
        span.hl-green { background-color: var(--mark-green); border-radius: 3px; }
        span.hl-yellow { background-color: var(--mark-yellow); border-radius: 3px; }
        span.hl-red { background-color: var(--mark-red); border-radius: 3px; }

        @media print {
            html, body { height: auto !important; overflow: visible !important; background: white; color: black; }
            body { display: block; }
            .toolbar { display: none !important; }
            .text-container { padding: 0 !important; background: white !important; height: auto !important; overflow: visible !important; }
            .editable-board { 
                border: none !important; 
                box-shadow: none !important; 
                width: 100% !important; 
                height: auto !important; 
                min-height: 0 !important;
                overflow: visible !important; 
                background: transparent !important; 
                padding: 0 !important;
                font-size: 14pt !important;
                display: block !important;
            }
        }
    </style>
</head>
<body>

<div class="toolbar">
    <div class="toolbar-row">
        <h1>📝 Lavagna Unica di Classe Live</h1>
        <div id="statusIndicator" class="status-badge">Stato: Caricamento... ⏳</div>
        <div class="action-buttons">
            <button id="btnWrite" class="btn-write" onclick="takeMarker()">Prendi il Pennarello ✍️</button>
            <button id="btnSpectate" class="btn-spectate" onclick="releaseMarker()" style="display:none;">Lascia il Pennarello (Fatto!) 👁️</button>
            <button class="btn-unlock" onclick="forceUnlock()">Libera Lavagna 🔓</button>
            <button class="btn-print" onclick="window.print()">Stampa in PDF 🖨️</button>
            <button class="btn-clear" onclick="clearBoard()">Cancella Tutto 🧹</button>
        </div>
    </div>
    
    <div class="tools-row">
        <!-- Pannello Tracciamento Audio Sincronizzato -->
        <div class="audio-panel">
            <label class="status-badge btn-file" for="audioUpload">Carica Audio Lezione 🎵</label>
            <input type="file" id="audioUpload" accept="audio/*" onchange="loadLocalAudio(event)">
            <audio id="audioPlayer" controls></audio>
        </div>
        
        <!-- Palette Evidenziatori Metodo Balboni Corretta -->
        <div class="marker-palette">
            <span>Evidenziatori:</span>
            <div class="marker m-green" title="Frase ben strutturata 🟢" onmousedown="event.preventDefault(); applyHighlight('hl-green')"></div>
            <div class="marker m-yellow" title="Imprecisione comunicativa 🟡" onmousedown="event.preventDefault(); applyHighlight('hl-yellow')"></div>
            <div class="marker m-red" title="Errore da correggere 🔴" onmousedown="event.preventDefault(); applyHighlight('hl-red')"></div>
            <div class="marker m-clear" title="Rimuovi evidenziatore ⚪" onmousedown="event.preventDefault(); applyHighlight('remove')">🧹</div>
        </div>
    </div>
</div>

<div class="text-container">
    <!-- Usiamo innerHTML per preservare gli elementi grafici spianati dagli evidenziatori -->
    <div id="sharedMainText" class="editable-board" contenteditable="false" data-placeholder="Usa i pulsanti in alto per prendere il controllo della lavagna e iniziare a scrivere..."></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        databaseURL: "https://esercizi-parlo-italiano-default-rtdb.europe-west1.firebasedatabase.app/"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const sessionRef = ref(db, "ricette_parlare/lavagna_singola_turni");
    const audioRef = ref(db, "ricette_parlare/lavagna_audio_state");

    const sharedMainText = document.getElementById('sharedMainText');
    const statusIndicator = document.getElementById('statusIndicator');
    const btnWrite = document.getElementById('btnWrite');
    const btnSpectate = document.getElementById('btnSpectate');
    const audioPlayer = document.getElementById('audioPlayer');

    const mySessionId = "user_" + Math.random().toString(36).substr(2, 9);
    
    let currentWriter = ""; 
    let currentHTML = "";
    let isSuppressingAudioUpdates = false;

    // Ascolto variazioni Testo e Token
    onValue(sessionRef, (snapshot) => {
        const data = snapshot.val() || {};
        currentWriter = data.writer || "";
        currentHTML = data.html || data.text || ""; // Retrocompatibilità se c'era solo testo semplice

        if (currentWriter !== mySessionId) {
            sharedMainText.innerHTML = currentHTML;
        }
        updateUI();
    });

    // Ascolto variazioni Audio (Sincronizzazione Live dei controlli) con gestione reset
onValue(audioRef, (snapshot) => {
    if (isSuppressingAudioUpdates) return;
    const data = snapshot.val();
    
    if (data) {
        // Se l'insegnante ha resettato l'audio (src vuoto)
        if (data.src === "") {
            audioPlayer.src = "";
            return;
        }

        if (data.src && audioPlayer.src !== data.src) {
            audioPlayer.src = data.src;
        }
        if (Math.abs(audioPlayer.currentTime - data.currentTime) > 1.5) {
            audioPlayer.currentTime = data.currentTime;
        }
        if (data.playing && audioPlayer.paused) {
            audioPlayer.play().catch(() => {});
        } else if (!data.playing && !audioPlayer.paused) {
            audioPlayer.pause();
        }
    } else {
        // Se il nodo Firebase è completamente vuoto
        audioPlayer.src = "";
    }
});

    function updateUI() {
        if (currentWriter === "") {
            statusIndicator.innerHTML = "Stato: Lavagna Libera 🟢";
            statusIndicator.className = "status-badge";
            sharedMainText.setAttribute("contenteditable", "false");
            btnWrite.style.display = "inline-block";
            btnWrite.disabled = false;
            btnSpectate.style.display = "none";
        } else if (currentWriter === mySessionId) {
            statusIndicator.innerHTML = "Stato: Stai scrivendo tu! ✍️ 🔥";
            statusIndicator.className = "status-badge status-writing";
            sharedMainText.setAttribute("contenteditable", "true");
            btnWrite.style.display = "none";
            btnSpectate.style.display = "inline-block";
        } else {
            statusIndicator.innerHTML = "Stato: Un compagno sta scrivendo... ⏳ 👁️";
            statusIndicator.className = "status-badge";
            sharedMainText.setAttribute("contenteditable", "false");
            btnWrite.style.display = "inline-block";
            btnWrite.disabled = true; 
            btnSpectate.style.display = "none";
        }
    }

    // Salva l'HTML comprensivo delle classi CSS dei colori
    function saveContent() {
        if (currentWriter === mySessionId) {
            update(sessionRef, { html: sharedMainText.innerHTML });
        }
    }

    sharedMainText.addEventListener('input', saveContent);

    // Gestione Evidenziatori Glottodidattici Ottimizzata
window.applyHighlight = function(className) {
    if (currentWriter !== mySessionId) {
        alert("Devi prima prendere il pennarello per poter evidenziare o correggere!");
        return;
    }

    const selection = window.getSelection();
    if (!selection || selection.rangeCount === 0 || selection.isCollapsed) {
        alert("Seleziona prima una parola o una frase del testo con il mouse per applicare l'evidenziatore.");
        return;
    }

    const range = selection.getRangeAt(0);

    if (className === 'remove') {
        // Rimuove l'evidenziazione ripristinando il testo pulito
        const extracted = range.extractContents();
        const textNode = document.createTextNode(extracted.textContent);
        range.insertNode(textNode);
    } else {
        // Se la selezione contiene già un'evidenziazione, estraiamo solo il testo per non nidificare i tag
        const extracted = range.extractContents();
        const span = document.createElement('span');
        span.className = className;
        span.textContent = extracted.textContent;
        range.insertNode(span);
    }
    
    // Rimuove la selezione visiva dopo aver applicato il colore
    selection.removeAllRanges();
    saveContent();
};

    // Funzione per convertire il file locale del PC in stringa dati leggibile dagli studenti
    window.loadLocalAudio = function(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Audio = e.target.result;
                audioPlayer.src = base64Audio;
                set(audioRef, { src: base64Audio, currentTime: 0, playing: false });
            };
            reader.readAsDataURL(file);
        }
    };

    // Sincronizzazione degli eventi del player audio verso Firebase
    function broadcastAudioState() {
        if (currentWriter === mySessionId) { 
            isSuppressingAudioUpdates = true;
            set(audioRef, {
                src: audioPlayer.src,
                currentTime: audioPlayer.currentTime,
                playing: !audioPlayer.paused
            }).then(() => { isSuppressingAudioUpdates = false; });
        }
    }

    audioPlayer.addEventListener('play', broadcastAudioState);
    audioPlayer.addEventListener('pause', broadcastAudioState);
    audioPlayer.addEventListener('seeked', broadcastAudioState);

    window.takeMarker = function() {
        if (currentWriter === "") {
            update(sessionRef, { writer: mySessionId });
        }
    };

    window.releaseMarker = function() {
        if (currentWriter === mySessionId) {
            sharedMainText.blur();
            update(sessionRef, { writer: "" });
        }
    };

    window.forceUnlock = function() {
        update(sessionRef, { writer: "" });
    };

    window.clearBoard = function() {
    if (confirm("Vuoi davvero svuotare l'intera lavagna e rimuovere l'audio per tutti?")) {
        // 1. Svuota il testo e libera il pennarello su Firebase
        set(sessionRef, { writer: "", html: "" }).then(() => {
            sharedMainText.innerHTML = "";
        });

        // 2. Resetta lo stato dell'audio su Firebase e sul player locale
        set(audioRef, { src: "", currentTime: 0, playing: false }).then(() => {
            audioPlayer.src = "";
            document.getElementById('audioUpload').value = ""; // Resetta anche il selettore di file HTML
        });
    }
};
</script>
</body>
</html>
