<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unità 1 — Lettura e Comprensione (Un albergo in centro)</title>
  <style>
    :root {
      color-scheme: light;
      font-family: 'Segoe UI', Inter, system-ui, -apple-system, sans-serif;
      --primary: #477755;
      --primary-light: #edf4ed;
      --primary-dark: #2f5739;
      --accent: #bd694d;
      --bg-main: #f5f1e7;
      --card-bg: #fffefa;
      --text: #292d28;
      --text-muted: #6b7069;
      --success: #278253;
      --success-bg: #e1f1e5;
      --border: #e7e5dc;
    }

    * { box-sizing: border-box; }
    :focus-visible { outline: 3px solid rgba(189, 105, 77, .55); outline-offset: 3px; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 16px;
      background:
        linear-gradient(rgba(250, 248, 241, .78), rgba(250, 248, 241, .78)),
        url("img/sfondo.jpeg") center calc(50% - var(--background-offset, 0px)) / cover fixed,
        radial-gradient(ellipse at 50% -12%, rgba(111, 151, 116, .18), transparent 42%),
        var(--bg-main);
      color: var(--text);
    }

    .container { width: min(100%, 880px); margin: 0 auto; }
    .home-navigation { display: flex; justify-content: flex-start; margin: 0 0 12px; }
    .home-navigation a {
      display: inline-flex; align-items: center; min-height: 42px; padding: 8px 16px;
      border: 1px solid #d8e5d8; border-radius: 10px; background: rgba(255, 254, 250, .94);
      color: var(--primary-dark); font-weight: 700; text-decoration: none; transition: background .2s, border-color .2s;
    }
    .home-navigation a:hover { background: var(--primary-light); border-color: var(--primary); }

    .hero {
      position: relative; isolation: isolate; overflow: hidden; margin: 8px 0 22px; padding: 28px 20px 26px;
      text-align: center; border: 1px solid rgba(71, 119, 85, .13); border-radius: 24px;
      background: linear-gradient(135deg, rgba(255, 254, 250, .94), rgba(242, 247, 239, .91));
      box-shadow: 0 12px 32px rgba(43, 69, 46, .07);
    }
    .eyebrow {
      display: inline-block; color: var(--primary-dark); font-size: .78rem; font-weight: 800;
      letter-spacing: .09em; text-transform: uppercase; background: #eaf1e8; padding: 8px 15px;
      border-radius: 20px; margin-bottom: 10px; box-shadow: inset 0 0 0 1px rgba(71, 119, 85, .11);
    }
    h1 { margin: 4px 0; font-size: clamp(1.9rem, 5vw, 2.65rem); letter-spacing: -.04em; color: var(--primary-dark); line-height: 1.12; }
    .hero-subtitle { margin: 8px 0 0; color: var(--text-muted); font-size: .98rem; }

    .instruction-box {
      background: #fff; border: 1px solid #d8e5d8; border-left: 5px solid var(--accent);
      border-radius: 16px; padding: 16px 20px; margin-bottom: 24px; box-shadow: 0 6px 18px rgba(43, 69, 46, .04);
    }
    .instruction-title { font-size: .85rem; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); margin-bottom: 6px; }
    .instruction-text { font-size: .98rem; color: var(--text); line-height: 1.5; }

    .top-controls {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;
      margin-bottom: 24px; padding: 14px 20px; border: 1px solid rgba(71, 119, 85, .13);
      border-radius: 16px; background: rgba(255, 254, 250, .96); box-shadow: 0 8px 22px rgba(43, 69, 46, .055);
    }
    .teacher-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; width: 100%; justify-content: space-between; }
    .teacher-toggle { display: flex; align-items: center; gap: 8px; font-size: .88rem; color: var(--text); cursor: pointer; font-weight: 600; user-select: none; }
    .teacher-toggle input { accent-color: var(--primary); }
    .mode-select-box { display: none; align-items: center; gap: 8px; color: var(--primary-dark); font-size: .88rem; font-weight: 700; }
    .mode-select-box.visible { display: flex; }
    .mode-select-box select { padding: 6px 10px; border: 1.5px solid #d4e1d5; border-radius: 8px; background: #fff; color: var(--primary-dark); font: inherit; font-size: .85rem; font-weight: 700; }
    button.reset-btn {
      padding: 6px 14px; border: 1px solid #fca5a5; border-radius: 10px; background: #fff; color: #dc2626;
      font: inherit; font-size: .8rem; font-weight: 700; cursor: pointer; min-height: 42px;
    }
    button.reset-btn:hover { background: #fef2f2; }

    .card {
      padding: clamp(20px, 4vw, 32px); border: 1px solid var(--border); border-radius: 26px;
      background: var(--card-bg); box-shadow: 0 22px 60px rgba(43, 69, 46, .11); margin-bottom: 32px;
    }
    .token-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; padding: 14px 18px; border-radius: 14px; background: var(--primary-light); color: var(--primary-dark); font-weight: 700; }
    .token-bar[hidden] { display: none; }
    .btn-token { min-height: 42px; padding: 8px 14px; border: 0; border-radius: 8px; background: var(--primary-dark); color: #fff; font-size: .85rem; font-weight: 700; cursor: pointer; }
    .btn-token.release { background: var(--accent); }
    .btn-token.busy { background: #e8ebea; color: #5f6863; cursor: not-allowed; }
    .student-login { display: none; margin-bottom: 18px; padding: 16px; border-radius: 14px; background: var(--primary-light); gap: 12px; align-items: center; }
    .student-login.visible { display: flex; }
    .student-login label { color: var(--primary-dark); font-size: .9rem; font-weight: 700; white-space: nowrap; }
    .student-login input { flex: 1; min-width: 0; padding: 10px 14px; border: 1.5px solid #d4e1d5; border-radius: 10px; font: inherit; background: #fff; }
    .save-status { margin: 0 0 18px; padding: 11px 14px; border: 1px solid #b7dfc1; border-radius: 12px; background: var(--success-bg); color: #17623c; font-size: .9rem; font-weight: 700; }
    .save-status[hidden], .results-section[hidden] { display: none; }
    .results-section h2 { color: var(--primary-dark); font-size: 1.3rem; }
    .question-responses details { margin-bottom: 10px; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: #fff; }
    .question-responses summary { padding: 14px 16px; background: var(--primary-light); color: var(--primary-dark); font-weight: 800; cursor: pointer; }
    .answer-list { padding: 4px 16px 12px; }
    .answer-row { display: grid; grid-template-columns: minmax(110px, .35fr) 1fr; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .answer-author { color: var(--primary-dark); font-weight: 700; }
    .answer-text { padding: 8px 10px; border-radius: 8px; overflow-wrap: anywhere; font-weight: 600; }
    .answer-text.correct { background: var(--success-bg); }
    .answer-text.incorrect { background: #fde8e7; }
    .section-box {
      display: flex; flex-direction: column; gap: 16px; padding: 22px; border: 1px solid var(--border);
      border-radius: 20px; background: #fff; box-shadow: 0 6px 18px rgba(43, 69, 46, .03);
    }
    .section-box[hidden] { display: none; }
    .section-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .section-title { min-width: 0; font-size: 1.15rem; font-weight: 800; line-height: 1.4; color: var(--primary-dark); }
    .number {
      display: inline-grid; width: 36px; height: 36px; place-items: center; margin-right: 10px;
      border-radius: 12px; background: var(--primary-light); color: var(--primary); font-size: .95rem; font-weight: 800; vertical-align: middle;
    }
    .badge { flex-shrink: 0; padding: 5px 10px; border-radius: 8px; font-size: .72rem; font-weight: 700; text-transform: uppercase; }
    .badge-locked { background: #e5e7eb; color: #6b7280; }
    .badge-active { background: var(--primary); color: #fff; }
    .badge-writing { background: #fef3c7; color: #d97706; }
    .badge-approved { background: var(--success-bg); color: #047857; }

    .question-form-card { padding: 14px; border: 1px solid #dce8dc; border-radius: 14px; background: #f7faf5; }
    .question-form-card label { display: block; margin-bottom: 6px; color: var(--primary-dark); font-size: .92rem; font-weight: 700; }
    textarea.question-input {
      width: 100%; min-height: 64px; padding: 10px 12px; border: 1.5px solid #d4e1d5; border-radius: 10px;
      background: #fff; font: inherit; font-size: .95rem; resize: vertical;
    }
    textarea.question-input:disabled { background: #f2f5f1; color: #475569; }
    .token-controls { display: flex; align-items: center; margin-top: 10px; }
    .btn-token {
      min-height: 42px; padding: 8px 14px; border: 0; border-radius: 8px; background: var(--primary-dark);
      color: #fff; font-size: .85rem; font-weight: 700; cursor: pointer;
    }
    .btn-token.release { background: var(--accent); }
    .btn-token.busy { background: #e8ebea; color: #5f6863; cursor: not-allowed; }

    .section-hint { padding: 0 0 0 12px; border-left: 3px solid #d5e2d5; color: var(--text); font-size: 1.05rem; font-weight: 700; }
    .options-grid { display: flex; flex-direction: column; gap: 10px; }
    .option-btn {
      display: flex; align-items: center; min-height: 48px; padding: 12px 16px; border: 1.5px solid #d4e1d5;
      border-radius: 12px; background: #faf9f5; font: inherit; font-size: 1rem; font-weight: 600;
      color: var(--text); cursor: pointer; text-align: left; transition: all .2s ease;
    }
    .option-btn:hover:not(:disabled) { background: var(--primary-light); border-color: var(--primary); }
    .option-btn.selected { border-color: var(--primary-dark); background: #e2ede3; color: var(--primary-dark); font-weight: 700; }
    .option-btn.selected.correct { border-color: var(--success); background: var(--success-bg); color: #17623c; }
    .option-btn.selected.incorrect { border-color: #dc2626; background: #fde8e7; color: #991b1b; }
    .option-btn:disabled { cursor: not-allowed; opacity: .8; }
    .teacher-action { display: flex; justify-content: flex-end; }
    .btn-approve {
      max-width: 100%; min-height: 42px; padding: 10px 18px; border: 0; border-radius: 12px; background: var(--primary);
      color: #fff; font-size: .9rem; font-weight: 700; line-height: 1.4; cursor: pointer; box-shadow: 0 4px 12px rgba(71, 119, 85, .2);
    }
    .btn-approve:hover { background: var(--primary-dark); }

    .slide-navigation {
      display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 20px;
      padding-top: 14px; border-top: 1px solid var(--border);
    }
    .slide-navigation button, .slide-navigation a {
      min-height: 42px; padding: 8px 18px; border: 1px solid #d8e5d8; border-radius: 10px;
      background: #fff; color: var(--primary-dark); font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; transition: all .2s;
    }
    .slide-navigation a { display: inline-flex; align-items: center; }
    .slide-navigation a[hidden] { display: none; }
    .slide-navigation button:hover:not(:disabled), .slide-navigation a:hover { background: var(--primary-light); border-color: var(--primary); }
    .slide-navigation button:disabled { cursor: not-allowed; opacity: .45; }
    .slide-progress { color: var(--primary-dark); font-size: .95rem; font-weight: 800; text-align: center; }
    body.teacher-mode .student-navigation { display: none; }
    body.teacher-mode .student-login { display: none !important; }

    @media (max-width: 600px) {
      body { padding: 16px 8px; }
      .section-box { padding: 14px; }
      .section-header { align-items: flex-start; }
      .badge { font-size: .66rem; padding: 5px 7px; }
      .slide-navigation { flex-direction: column; gap: 8px; }
      .slide-navigation button, .slide-navigation a { justify-content: center; width: 100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="container">
    <nav class="home-navigation" aria-label="Navigazione principale">
      <a href="index.html">← Torna all’inizio</a>
    </nav>

    <header class="hero">
      <span class="eyebrow">Unità 1 · Lettura e Comprensione</span>
      <h1>Un albergo in centro</h1>
      <p class="hero-subtitle">Scegliete la risposta corretta e formulate una domanda per il vostro compagno.</p>
    </header>

    <div class="instruction-box">
      <div class="instruction-title">💡 Задание · Esercizio A</div>
      <div class="instruction-text">👉 <strong>Выберите правильный вариант ответа и сформулируйте вопрос:</strong></div>
    </div>

    <div class="top-controls">
      <div class="teacher-controls">
        <label class="teacher-toggle">
          <input type="checkbox" id="teacher-mode">
          Режим учителя · Modalità insegnante
        </label>
        <div class="mode-select-box" id="mode-selector-container">
          <label for="work-mode">Режим работы:</label>
          <select id="work-mode">
            <option value="token">Uno alla volta · По одному</option>
            <option value="all">Tutti insieme · Все вместе</option>
          </select>
        </div>
        <button id="reset" class="reset-btn" type="button" hidden>⚠️ Сбросить · Azzera</button>
        <button id="teacher-release-token" class="btn-token" type="button" hidden>🔓 Libera il token</button>
      </div>
    </div>

    <section class="card" aria-label="Domande dell’esercizio">
      <div class="token-bar" id="token-bar">
        <span id="token-status-text" aria-live="polite"></span>
        <button id="btn-take-token" class="btn-token" type="button">✋ Prendi la parola</button>
      </div>
      <div class="student-login" id="student-login">
        <label for="student-name">Ваше имя (Имя Фамилия) · Nome e cognome:</label>
        <input id="student-name" type="text" placeholder="Введите ваше имя · Inserisci il tuo nome">
      </div>
      <p id="save-status" class="save-status" role="status" aria-live="polite" hidden></p>
      <div id="questions-container"></div>
      <nav class="slide-navigation student-navigation" aria-label="Navigazione schede">
        <button id="previous-question" type="button">← Precedente</button>
        <span id="question-progress" class="slide-progress" aria-live="polite"></span>
        <button id="next-question" type="button">Successiva →</button>
        <a id="next-exercise" href="es_b.html" hidden>Vai all’esercizio B →</a>
      </nav>
      <button id="btn-submit-all" class="btn-approve" type="button" hidden>📤 Invia le risposte</button>
    </section>
    <section id="results-section" class="results-section" hidden>
      <h2>📋 Risposte degli studenti</h2>
      <div id="responses-list"></div>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "INSERISCI_API_KEY",
      authDomain: "esercizi-parlo-italiano.firebaseapp.com",
      databaseURL: "https://esercizi-parlo-italiano-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "esercizi-parlo-italiano",
      appId: "INSERISCI_APP_ID"
    };

    const sectionsData = [
      { hint: "L’albergo Ponte Vecchio", options: ["è a Roma.", "è a Firenze."], correctOption: 1 },
      { hint: "L’albergo Ponte Vecchio", options: ["è in periferia", "è in centro"], correctOption: 1 },
      { hint: "Victor è", options: ["il direttore dell'albergo.", "avvocato."], correctOption: 1 },
      { hint: "Victor", options: ["è in Italia per turismo", "è in Italia per affari"], correctOption: 1 },
      { hint: "Karl e Klaus", options: ["è studente", "sono studenti"], correctOption: 1 },
      { hint: "Karl e Klaus", options: ["sono in Italia per studiare il tedesco", "sono in Italia per studiare l’italiano"], correctOption: 1 },
      { hint: "Mary è in Italia", options: ["per insegnare l'italiano", "per insegnare l'inglese."], correctOption: 1 },
      { hint: "Mary è", options: ["un’insegnante inglese", "un’insegnante americana"], correctOption: 0 },
      { hint: "Yoko", options: ["è insegnante", "è dentista"], correctOption: 1 },
      { hint: "Yoko è in Italia", options: ["per una conferenza", "per turismo"], correctOption: 0 },
      { hint: "Olga è in Italia", options: ["per conoscere i ragazzi italiani", "per studiare e per fare shopping"], correctOption: 1 },
      { hint: "Olga è", options: ["una studentessa italiana", "una studentessa di italiano"], correctOption: 1 },
      { hint: "Il direttore dell’albergo", options: ["è molto occupato.", "è molto sposato"], correctOption: 0 }
    ];

    const myClientId = "user_" + Math.random().toString(36).substring(2, 9);
    const teacherToggle = document.getElementById("teacher-mode");
    const resetButton = document.getElementById("reset");
    const modeSelectorContainer = document.getElementById("mode-selector-container");
    const workModeSelect = document.getElementById("work-mode");
    const teacherReleaseTokenButton = document.getElementById("teacher-release-token");
    const btnTakeToken = document.getElementById("btn-take-token");
    const tokenStatusText = document.getElementById("token-status-text");
    const tokenBar = document.getElementById("token-bar");
    const studentLogin = document.getElementById("student-login");
    const studentNameInput = document.getElementById("student-name");
    const saveStatus = document.getElementById("save-status");
    const submitAllButton = document.getElementById("btn-submit-all");
    const resultsSection = document.getElementById("results-section");
    const responsesList = document.getElementById("responses-list");
    const questionsContainer = document.getElementById("questions-container");
    const previousButton = document.getElementById("previous-question");
    const nextButton = document.getElementById("next-question");
    const progressText = document.getElementById("question-progress");
    const nextExerciseLink = document.getElementById("next-exercise");

    let answersRef = null;
    let isTeacher = false;
    let currentWorkMode = "token";
    let currentWriter = null;
    let currentResponsesData = {};
    let localResponses = {};
    let activeQuestion = 0;
    const questionElements = [];
    let allResponses = {};

    if (localStorage.getItem("parlo_student_name")) {
      studentNameInput.value = localStorage.getItem("parlo_student_name");
    }

    sectionsData.forEach((question, index) => {
      const box = document.createElement("div");
      box.className = "section-box";
      box.hidden = index !== activeQuestion;

      const header = document.createElement("div");
      header.className = "section-header";
      const title = document.createElement("div");
      title.className = "section-title";
      title.innerHTML = `<span class="number">${index + 1}</span>${question.hint}...`;
      header.appendChild(title);

      const questionCard = document.createElement("div");
      questionCard.className = "question-form-card";
      const questionLabel = document.createElement("label");
      questionLabel.htmlFor = `question-input-${index}`;
      questionLabel.textContent = "✍️ Formula una domanda:";
      const questionInput = document.createElement("textarea");
      questionInput.id = `question-input-${index}`;
      questionInput.className = "question-input";
      questionInput.rows = 2;
      questionInput.placeholder = "Scrivi qui la domanda...";
      questionInput.addEventListener("input", () => {
        if (currentWorkMode === "all") {
          localResponses[index] = { ...(localResponses[index] || {}), formulatedQuestion: questionInput.value };
          saveStatus.hidden = true;
        } else if (answersRef && currentWriter === myClientId) {
          answersRef.child("tokenData").child("responses").child(String(index)).child("formulatedQuestion").set(questionInput.value);
        }
      });
      questionCard.append(questionLabel, questionInput);

      const hint = document.createElement("div");
      hint.className = "section-hint";
      hint.textContent = `${question.hint}...`;
      const options = document.createElement("div");
      options.className = "options-grid";
      const optionButtons = question.options.map((optionText, optionIndex) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "option-btn";
        button.textContent = `${String.fromCharCode(97 + optionIndex)}) ${optionText}`;
        button.addEventListener("click", () => {
          if (currentWorkMode === "all") {
            localResponses[index] = { ...(localResponses[index] || {}), selectedOption: optionIndex };
            saveStatus.hidden = true;
            updateUIState();
          } else if (answersRef && currentWriter === myClientId) {
            answersRef.child("tokenData").child("responses").child(String(index)).child("selectedOption").set(optionIndex);
          }
        });
        options.appendChild(button);
        return button;
      });

      box.append(header, questionCard, hint, options);
      questionsContainer.appendChild(box);
      questionElements.push({ box, questionInput, optionButtons });
    });

    function updateNavigation() {
      const last = activeQuestion === sectionsData.length - 1;
      previousButton.disabled = activeQuestion === 0;
      nextButton.hidden = last;
      nextExerciseLink.hidden = !last;
      progressText.textContent = `Domanda ${activeQuestion + 1} di ${sectionsData.length}`;
    }

    function showQuestion(index) {
      activeQuestion = Math.max(0, Math.min(index, sectionsData.length - 1));
      questionElements.forEach((item, itemIndex) => { item.box.hidden = itemIndex !== activeQuestion; });
      updateNavigation();
    }

    previousButton.addEventListener("click", () => showQuestion(activeQuestion - 1));
    nextButton.addEventListener("click", () => showQuestion(activeQuestion + 1));

    document.addEventListener("keydown", (event) => {
      if (event.altKey || event.ctrlKey || event.metaKey) return;
      if (event.target.closest("input, textarea, select, button, a, [tabindex]")) return;
      if (event.key === "ArrowLeft" && activeQuestion > 0) showQuestion(activeQuestion - 1);
      if (event.key === "ArrowRight") showQuestion(activeQuestion + 1);
    });

    teacherToggle.addEventListener("change", (event) => {
      isTeacher = event.target.checked;
      document.body.classList.toggle("teacher-mode", isTeacher);
      modeSelectorContainer.classList.toggle("visible", isTeacher);
      resetButton.hidden = !isTeacher;
      updateUIState();
    });

    workModeSelect.addEventListener("change", (event) => {
      if (!isTeacher) return;
      currentWorkMode = event.target.value;
      updateUIState();
      if (answersRef) answersRef.child("workMode").set(currentWorkMode);
    });

    btnTakeToken.addEventListener("click", () => {
      if (!answersRef || currentWorkMode !== "token") return;
      answersRef.child("tokenData").child("currentWriter").set(currentWriter === myClientId ? null : myClientId);
    });

    teacherReleaseTokenButton.addEventListener("click", () => {
      if (isTeacher && currentWorkMode === "token" && answersRef) {
        answersRef.child("tokenData").child("currentWriter").set(null);
      }
    });

    submitAllButton.addEventListener("click", async () => {
      const name = studentNameInput.value.trim();
      if (!name) {
        alert("Inserisci il tuo nome e cognome.");
        studentNameInput.focus();
        return;
      }
      if (!answersRef) {
        alert("Connessione al database non disponibile.");
        return;
      }
      localStorage.setItem("parlo_student_name", name);
      const studentId = name.replace(/[.#$\/\[\]]/g, "_");
      try {
        await answersRef.child("allStudentsData").child("students").child(studentId).update({
          name,
          answers: localResponses,
          timestamp: Date.now()
        });
        saveStatus.textContent = "✅ Risposte inviate all’insegnante!";
        saveStatus.hidden = false;
      } catch (error) {
        alert("Errore durante l’invio delle risposte.");
      }
    });

    function updateUIState() {
      const canEdit = currentWorkMode === "all" ? !isTeacher : currentWriter === myClientId;
      const responses = currentWorkMode === "all" ? localResponses : currentResponsesData;
      questionElements.forEach((item, index) => {
        const response = responses[index] || {};
        const formulatedQuestion = response.formulatedQuestion || "";
        if (document.activeElement !== item.questionInput && item.questionInput.value !== formulatedQuestion) {
          item.questionInput.value = formulatedQuestion;
        }
        item.questionInput.disabled = !canEdit;
        item.optionButtons.forEach((button, optionIndex) => {
          const selected = response.selectedOption === optionIndex;
          button.disabled = !canEdit;
          button.classList.toggle("selected", selected);
          button.classList.toggle("correct", selected && optionIndex === sectionsData[index].correctOption);
          button.classList.toggle("incorrect", selected && optionIndex !== sectionsData[index].correctOption);
        });
      });

      const tokenMode = currentWorkMode === "token";
      tokenBar.hidden = !tokenMode || isTeacher;
      studentLogin.classList.toggle("visible", !tokenMode && !isTeacher);
      submitAllButton.hidden = tokenMode || isTeacher;
      resultsSection.hidden = tokenMode;
      if (tokenMode) {
        if (!currentWriter) {
          tokenStatusText.textContent = "";
          btnTakeToken.textContent = "✋ Взять слово · Prendi la parola";
          btnTakeToken.className = "btn-token";
          btnTakeToken.disabled = false;
        } else if (currentWriter === myClientId) {
          tokenStatusText.textContent = "Вы редактируете · Stai modificando";
          btnTakeToken.textContent = "✔ Передать слово · Lascia la parola";
          btnTakeToken.className = "btn-token release";
          btnTakeToken.disabled = false;
        } else {
          tokenStatusText.textContent = "🔒 Пишет одноклассник · Compagno scrive";
          btnTakeToken.textContent = "🔒 Пишет одноклассник · Compagno scrive";
          btnTakeToken.className = "btn-token busy";
          btnTakeToken.disabled = true;
        }
      }
      teacherReleaseTokenButton.hidden = !isTeacher || !tokenMode;
      questionElements.forEach((item, index) => { item.box.hidden = index !== activeQuestion; });
      updateNavigation();
      if (!tokenMode) renderResponsesAllMode();
    }

    function renderResponsesAllMode() {
      responsesList.replaceChildren();
      const students = allResponses.students || {};
      const entries = Object.entries(students);
      if (entries.length === 0) {
        const empty = document.createElement("p");
        empty.textContent = "Пока никто не отправил ответы...";
        empty.style.color = "var(--text-muted)";
        responsesList.appendChild(empty);
        return;
      }

      const grouped = document.createElement("div");
      grouped.className = "question-responses";
      sectionsData.forEach((question, index) => {
        const details = document.createElement("details");
        if (index === 0) details.open = true;
        const summary = document.createElement("summary");
        summary.textContent = `Domanda ${index + 1}: ${question.hint}...`;
        details.appendChild(summary);
        const list = document.createElement("div");
        list.className = "answer-list";
        entries.forEach(([, student]) => {
          const row = document.createElement("div");
          row.className = "answer-row";
          const author = document.createElement("span");
          author.className = "answer-author";
          author.textContent = student.name || "Studente";
          const answer = document.createElement("div");
          answer.className = "answer-text";
          const response = student.answers?.[index] || {};
          const chosen = response.selectedOption;
          const formulated = response.formulatedQuestion?.trim();
          answer.textContent = `${chosen === undefined ? "—" : `${String.fromCharCode(97 + chosen)}) ${question.options[chosen]}`}${formulated ? ` · Domanda: ${formulated}` : ""}`;
          if (chosen !== undefined) answer.classList.add(chosen === question.correctOption ? "correct" : "incorrect");
          row.append(author, answer);
          list.appendChild(row);
        });
        details.append(summary, list);
        grouped.appendChild(details);
      });
      responsesList.appendChild(grouped);
    }

    if (window.firebase) {
      try {
        firebase.initializeApp(firebaseConfig);
        answersRef = firebase.database().ref("esercizi/unita1-scelta-multipla");
        answersRef.on("value", (snapshot) => {
          const data = snapshot.val() || {};
          currentWorkMode = data.workMode || "token";
          workModeSelect.value = currentWorkMode;
          const tokenData = data.tokenData || {};
          currentWriter = tokenData.currentWriter || null;
          currentResponsesData = tokenData.responses || data.responses || {};
          allResponses = data.allStudentsData || {};
          updateUIState();
        });
      } catch (error) {
        console.error("Errore Firebase:", error);
      }
    }

    resetButton.addEventListener("click", () => {
      if (answersRef && confirm("Vuoi azzerare tutte le risposte?")) {
        answersRef.set({
          workMode: currentWorkMode,
          tokenData: { currentWriter: null, responses: {} },
          allStudentsData: {}
        });
        localResponses = {};
        saveStatus.hidden = true;
        updateUIState();
      }
    });

    updateUIState();

    let backgroundUpdatePending = false;
    function updateBackgroundParallax() {
      if (backgroundUpdatePending) return;
      backgroundUpdatePending = true;
      requestAnimationFrame(() => {
        const offset = window.matchMedia("(prefers-reduced-motion: reduce)").matches
          ? 0
          : Math.min(window.scrollY * 0.12, 180);
        document.body.style.setProperty("--background-offset", `${offset}px`);
        backgroundUpdatePending = false;
      });
    }
    window.addEventListener("scroll", updateBackgroundParallax, { passive: true });
    updateBackgroundParallax();
  </script>
</body>
</html>
