<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lezione Interattiva</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #e74c3c;
            --bg-color: #fcf8f2;
            --text-color: #34495e;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); color: var(--text-color); line-height: 1.6; padding: 20px; margin: 0; }
        .main-container { max-width: 800px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; }
        h1 { color: var(--primary-color); margin-bottom: 5px; }
        .subtitle { font-style: italic; color: #7f8c8d; }
        
        #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(44, 62, 80, 0.95); z-index: 2000; display: flex; align-items: center; justify-content: center; }
        .login-box { background: white; padding: 30px; border-radius: 8px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 90%; max-width: 400px; }
        .login-box input { width: 100%; padding: 12px; margin: 15px 0; text-align: center; border: 2px solid #cbd5e0; border-radius: 6px; font-size: 16px; box-sizing: border-box; }
        .login-box button { background: var(--primary-color); color: white; padding: 12px 20px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; width: 100%; cursor: pointer; }

        .didactic-block { background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 30px; border-left: 5px solid var(--primary-color); }
        .fase-elicitazione { border-left-color: #e67e22; }
        .fase-ascolto { border-left-color: #2980b9; }
        .fase-lettura { border-left-color: #27ae60; }
        
        .question-title { font-weight: bold; font-size: 1.15rem; color: var(--primary-color); margin-bottom: 10px; }
        .fase-label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; color: #7f8c8d; font-weight: bold; margin-bottom: 5px; }

        .board-container { background: #3a475d; padding: 12px; border-radius: 6px; margin-top: 15px; }
        .board-toolbar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
        .status-badge { padding: 4px 10px; border-radius: 20px; font-weight: bold; font-size: 0.85rem; background: #4a5568; color: white; user-select: none; }
        .status-writing { background: #f1c40f; color: #1a202c; }
        .status-reading { background: #2ecc71; }
        
        .action-buttons { display: flex; gap: 6px; flex-wrap: wrap; }
        button { padding: 6px 12px; font-size: 12px; border-radius: 4px; border: none; cursor: pointer; font-weight: bold; transition: all 0.2s; }
        .btn-write { background: #4CAF50; color: white; }
        .btn-spectate { background: #2196F3; color: white; }
        .btn-submit { background: #9b59b6; color: white; } 
        .btn-unlock { background: #00bcd4; color: white; } 
        .btn-clear { background: var(--accent-color); color: white; }
        button:hover { opacity: 0.9; }
        
        .editable-board { width: 100%; min-height: 80px; padding: 10px; font-size: 15px; border-radius: 4px; border: 2px solid #4a5568; background: #ffffff; color: #2d3748; box-sizing: border-box; white-space: pre-wrap; word-wrap: break-word; }
        .editable-board:focus { outline: none; border-color: #4CAF50; }
        .editable-board[contenteditable="false"] { background: #edf2f5; color: #4a5568; }
        .editable-board:empty:before { content: attr(data-placeholder); color: #718096; font-style: italic; }

        .fixed-container { background: #ffffff; border: 2px solid #cbd5e0; border-left: 5px solid #2ecc71; border-radius: 6px; padding: 15px; margin-top: 10px; display: flex; justify-content: space-between; align-items: flex-start; gap: 15px; }
        .fixed-text-content { font-size: 15px; color: #2d3748; white-space: pre-wrap; word-wrap: break-word; }
        .author-label { font-size: 0.8rem; color: #718096; margin-bottom: 8px; font-weight: bold; }
        .btn-edit { background: #718096; color: white; padding: 6px 12px; font-size: 12px; }

        .btn-invia-fase { background-color: var(--primary-color); color: white; padding: 12px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 15px; font-weight: bold; width: 100%; margin: 15px 0 35px 0; }
        
        /* Stili Gioco Flashcard */
        .game-img { width: 45%; border-radius: 8px; cursor: pointer; border: 4px solid transparent; transition: transform 0.2s; }
        .game-img:hover { transform: scale(1.05); }
        
        /* Slider Flashcard */
        .flashcard-slider {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            gap: 20px;
            padding: 20px 0;
            scrollbar-width: thin;
        }
        
        /* Stile base (per smartphone - flashcard grandi) */
        .flashcard-item {
            flex: 0 0 70%; 
            scroll-snap-align: center;
            background: #fff;
            border: 2px solid #ddd;
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
        .flashcard-item img {
            width: 100%;
            aspect-ratio: 1 / 1; 
            object-fit: contain; 
            background-color: #f9f9f9; 
            border-radius: 10px;
        }

        /* Stile per PC (schermi più larghi di 768px) */
        @media (min-width: 768px) {
            .flashcard-item { flex: 0 0 45%; }
            .flashcard-item img { height: 300px; }
        }

        /* Contenitore relativo per posizionare le frecce */
        .slider-wrapper { position: relative; display: flex; align-items: center; }
        
        .arrow-btn {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: rgba(44, 62, 80, 0.8); color: white;
            border: none; padding: 10px; cursor: pointer;
            z-index: 10; border-radius: 50%; font-size: 1.5rem;
        }
        .prev-btn { left: -15px; }
        .next-btn { right: -15px; }
        
    </style>
</head>
<body>

    <div id="login-overlay">
        <div class="login-box">
            <h2>Benvenuti in classe! 🇮🇹</h2>
            <input type="text" id="username-input" placeholder="Il tuo nome (es. Maria)" onkeypress="if(event.key==='Enter') entraInClasse()">
            <button onclick="entraInClasse()">Entra</button>
        </div>
    </div>

    <div class="main-container">
        <!-- L'INTESTAZIONE SI RIEMPIE DA SOLA -->
        <div class="header">
            <h1 id="titolo-lezione">Caricamento...</h1>
            <p id="sottotitolo-lezione" class="subtitle"></p>
        </div>
        <div style="text-align: center; margin-bottom: 25px;">
            <img id="banner-lezione" src="" style="max-width: 100%; border-radius: 8px; display: none;">
        </div>

        <!-- IL MOTORE COSTRUIRÀ TUTTE LE SCHEDE QUI DENTRO -->
        <div id="contenitore-dinamico"></div>
    </div>

    <!-- SCRIPT MOTORE -->
    <script type="module">
        import { ConfigLezione } from "./dati-lezione.js";
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // ==========================================
        // 1. INIZIALIZZAZIONE FIREBASE E HEADER
        // ==========================================
        const firebaseConfig = { databaseURL: "https://esercizi-parlo-italiano-default-rtdb.europe-west1.firebasedatabase.app/" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const ID_LEZIONE = ConfigLezione.idFirebase; 

        document.title = ConfigLezione.titolo;
        document.getElementById('titolo-lezione').innerText = ConfigLezione.titolo;
        document.getElementById('sottotitolo-lezione').innerText = ConfigLezione.sottotitolo;
        if(ConfigLezione.bannerImg) {
            document.getElementById('banner-lezione').src = ConfigLezione.bannerImg;
            document.getElementById('banner-lezione').style.display = "inline-block";
        }

        // ==========================================
        // 2. FUNZIONI DI SUPPORTO
        // ==========================================
        function creaLavagna(id, placeholder) {
            return `
            <div id="edit_container_${id}" class="board-container">
                <div class="board-toolbar">
                    <div id="status_${id}" class="status-badge">Caricamento... ⏳</div>
                    <div class="action-buttons">
                        <button class="btn-write" onclick="takeMarker('${id}')">Scrivi ✍️</button>
                        <button id="btn_spec_${id}" class="btn-spectate" onclick="releaseMarker('${id}')" style="display:none;">Lascia 👁️</button>
                        <button id="btn_invia_${id}" class="btn-submit" onclick="submitBoard('${id}')" style="display:none;">Invia 🚀</button>
                        <button class="btn-unlock" onclick="forceUnlock('${id}')">Libera 🔓</button>
                        <button class="btn-clear" onclick="clearBoard('${id}')">Cancella 🧹</button>
                    </div>
                </div>
                <div id="board_${id}" class="editable-board" contenteditable="false" data-placeholder="${placeholder}"></div>
            </div>
            <div id="fixed_container_${id}" class="fixed-container" style="display: none;">
                <div style="flex: 1;"><div id="author_fixed_${id}" class="author-label"></div><div id="text_fixed_${id}" class="fixed-text-content"></div></div>
                <button class="btn-edit" onclick="editBoard('${id}')">Modifica ✏️</button>
            </div>`;
        }

        window.scrollSlider = function(direction) {
            const container = document.getElementById('flashcard-slider');
            const scrollAmount = container.offsetWidth * 0.7;
            container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        };

        window.cambiaFase = function(faseTarget, stato) {
            set(ref(db, `${ID_LEZIONE}/stato_${faseTarget}`), stato).then(() => {
                const targetElement = document.getElementById(`sezione-${faseTarget}`);
                if (targetElement) { targetElement.style.display = 'block'; window.scrollTo({ top: targetElement.offsetTop - 20, behavior: 'smooth' }); }
            });
        };

        // ==========================================
        // 3. GENERAZIONE HTML (Inietta l'HTML prima del gioco e lavagne)
        // ==========================================
        let htmlDinamico = "";

        if (ConfigLezione.elicitazione) {
            htmlDinamico += `
            <div class="didactic-block fase-elicitazione">
                <div class="fase-label">Fase 1</div>
                <div class="question-title">${ConfigLezione.elicitazione.titolo}</div>
                <p>${ConfigLezione.elicitazione.intro}</p>
                
                ${ConfigLezione.elicitazione.immagineMappa ? `<div style="text-align: center; margin: 20px 0;"><img src="${ConfigLezione.elicitazione.immagineMappa}" style="max-width: 100%; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);" alt="Mappa"></div>` : ''}
                
                <div class="question-title" style="margin-top:20px;">✍️ Scrivete qui le parole che conoscete già:</div>
                ${creaLavagna('elicit', 'Scrivete qui le parole italiane che conoscete...')}
                
                <hr style="margin: 40px 0; border: 0; border-top: 2px dashed #ccc;">

                <div class="question-title">📚 Studiamo i nuovi vocaboli:</div>
                <div class="slider-wrapper">
                    <button class="arrow-btn prev-btn" onclick="scrollSlider(-1)">❮</button>
                    <div id="flashcard-slider" class="flashcard-slider">
                        ${ConfigLezione.elicitazione.vocabolario.map(item => `
                            <div class="flashcard-item" onclick="new Audio('${item.audio}').play()">
                                <img src="${item.img}" alt="${item.parola}">
                                <div style="font-size:1.2rem; font-weight:bold; margin-top:10px;">${item.parola}</div>
                                <small style="color:#777;">(clicca per ascoltare)</small>
                            </div>
                        `).join('')}
                    </div>
                    <button class="arrow-btn next-btn" onclick="scrollSlider(1)">❯</button>
                </div>

                <hr style="margin: 30px 0; border: 0; border-top: 2px solid #ddd;">
                
                <div class="question-title">🎮 Ora mettiti alla prova!</div>
            <div style="background: #f8f9fa; padding: 20px; border-radius: 8px; text-align: center; border: 2px solid #cbd5e0;">
                
                <!-- Barra di stato per il turno -->
                <div id="game-status-bar" class="status-badge" style="margin-bottom: 15px; display: inline-block;">Libero 🟢</div>
                <button id="btn-gioca" onclick="prendiControlloGioco()" style="background: #f1c40f; color: #1a202c; border:none; padding: 5px 15px; border-radius:20px; cursor:pointer; font-weight:bold; margin-left:10px;">Rispondo io 🙋‍♂️</button>

                <!-- Immagine Centrale -->
                <div style="margin: 20px 0;">
                    <img id="game-main-img" src="" style="width: 100%; max-width: 300px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
                </div>

                <button onclick="playGameAudio()" style="background: #2196F3; color: white; padding: 10px 20px; border-radius: 50px; border:none; margin-bottom: 20px; cursor:pointer;">🔊 Ascolta</button>
                <audio id="game-audio" src=""></audio>

                <!-- Pulsanti per le parole -->
                <div style="display: flex; gap: 15px; justify-content: center; margin-bottom: 20px;">
                    <button id="game-btn-1" onclick="selezionaParola(1)" style="flex: 1; padding: 15px; font-size: 1.2rem; background: white; border: 2px solid #cbd5e0; border-radius: 8px; cursor: pointer; color: #2c3e50; font-weight:bold; transition: all 0.2s;"></button>
                    <button id="game-btn-2" onclick="selezionaParola(2)" style="flex: 1; padding: 15px; font-size: 1.2rem; background: white; border: 2px solid #cbd5e0; border-radius: 8px; cursor: pointer; color: #2c3e50; font-weight:bold; transition: all 0.2s;"></button>
                </div>

                <!-- Tasto Conferma e Feedback -->
                <button id="game-conferma-btn" onclick="confermaSceltaGioco()" style="display: none; background: #9b59b6; color: white; font-size: 1.2rem; padding: 10px 30px; border-radius: 6px; cursor:pointer; margin: 0 auto; border:none; font-weight:bold;">Conferma Scelta ✔️</button>
                <div id="game-feedback" style="font-size: 1.5rem; font-weight: bold; margin-top: 20px; min-height: 40px;"></div>

                <button id="game-next-btn" onclick="nextGameRound()" style="background: var(--primary-color); color: white; border:none; font-size: 1rem; padding: 10px; margin-top: 15px; width: 100%; border-radius:6px; cursor:pointer;">Prossima Parola ➡️</button>
            </div>
            
            <button id="btn_fase_ascolto" class="btn-invia-fase" onclick="cambiaFase('fase_ascolto', true)">Passa alla fase di Ascolto 🚀</button>`;
        }
        
        if (ConfigLezione.ascolto) {
            htmlDinamico += `
            <div id="sezione-fase_ascolto" style="display: none;">
                <div class="didactic-block fase-ascolto">
                    <div class="fase-label">Fase 2</div>
                    <div class="question-title">${ConfigLezione.ascolto.titolo}</div>
                    <p>${ConfigLezione.ascolto.istruzioni}</p>
                    <div style="text-align: center; margin: 20px 0;">
                        <audio src="${ConfigLezione.ascolto.tracciaAudio}" controls style="width: 100%; max-width: 400px;"></audio>
                    </div>
                    ${creaLavagna('ascolto', 'Cosa avete capito?...')}
                </div>
                <button id="btn_fase_lettura" class="btn-invia-fase" onclick="cambiaFase('fase_lettura', true)">Passa alla Lettura 📖</button>
            </div>`;
        }

        // Iniettiamo l'HTML prima di avviare i listener!
        document.getElementById('contenitore-dinamico').innerHTML = htmlDinamico;

        // ==========================================
        // 4. LOGICA LOGIN E LAVAGNE
        // ==========================================
        const mySessionId = "user_" + Math.random().toString(36).substr(2, 9);
        let myUserName = localStorage.getItem('parlo_italiano_username') || "";

        if (myUserName) document.getElementById('login-overlay').style.display = 'none';
        window.entraInClasse = function() {
            const nameInput = document.getElementById('username-input').value.trim();
            if (nameInput.length < 2) return alert("Inserisci il tuo nome.");
            myUserName = nameInput; localStorage.setItem('parlo_italiano_username', myUserName); 
            document.getElementById('login-overlay').style.display = 'none';
        };

        const boards = {}; const currentWriters = {}; const currentWriterNames = {};
        document.querySelectorAll('.editable-board').forEach(board => {
            const key = board.id.replace('board_', '');
            boards[key] = board; currentWriters[key] = ""; currentWriterNames[key] = "";

            const nContenuto = ref(db, `${ID_LEZIONE}/content_${key}`);
            const nToken = ref(db, `${ID_LEZIONE}/token_${key}`);
            const nStato = ref(db, `${ID_LEZIONE}/view_state_${key}`);

            onValue(nContenuto, (snap) => {
                const html = snap.val()?.html || "";
                if (currentWriters[key] !== mySessionId) boards[key].innerHTML = html;
                const txtFisso = document.getElementById(`text_fixed_${key}`);
                if (txtFisso) txtFisso.innerHTML = html;
            });
            onValue(nToken, (snap) => {
                const data = snap.val();
                if (data && typeof data === 'object') { currentWriters[key] = data.id || ""; currentWriterNames[key] = data.name || "Qualcuno"; } 
                else { currentWriters[key] = ""; currentWriterNames[key] = ""; }
                updateBoardUI(key);
            });
            onValue(nStato, (snap) => {
                const isFixed = snap.val()?.fixed || false; const author = snap.val()?.author || "";
                document.getElementById(`edit_container_${key}`).style.display = isFixed ? "none" : "block";
                document.getElementById(`fixed_container_${key}`).style.display = isFixed ? "flex" : "none";
                const lbl = document.getElementById(`author_fixed_${key}`); if (lbl) lbl.innerHTML = author ? `Inviato da: ${author} 👤` : "";
            });
            board.addEventListener('input', () => { if (currentWriters[key] === mySessionId) set(nContenuto, { html: boards[key].innerHTML }); });
        });

        function updateBoardUI(key) {
            const b = boards[key]; const s = document.getElementById(`status_${key}`);
            const wBtn = document.querySelector(`#edit_container_${key} .btn-write`);
            const specBtn = document.getElementById(`btn_spec_${key}`);
            const invBtn = document.getElementById(`btn_invia_${key}`);
            if (!b || !s) return;

            if (currentWriters[key] === "") {
                s.innerHTML = "Libera 🟢"; s.className = "status-badge status-reading"; b.setAttribute("contenteditable", "false");
                if (wBtn) { wBtn.style.display = "inline-block"; wBtn.disabled = false; }
                if (specBtn) specBtn.style.display = "none"; if (invBtn) invBtn.style.display = "none";
            } else if (currentWriters[key] === mySessionId) {
                s.innerHTML = "Scrivi tu! ✍️"; s.className = "status-badge status-writing"; b.setAttribute("contenteditable", "true");
                if (wBtn) wBtn.style.display = "none";
                if (specBtn) specBtn.style.display = "inline-block"; if (invBtn) invBtn.style.display = "inline-block";
            } else {
                s.innerHTML = `⏳ Scrive ${currentWriterNames[key]}`; s.className = "status-badge"; b.setAttribute("contenteditable", "false");
                if (wBtn) { wBtn.style.display = "inline-block"; wBtn.disabled = true; }
                if (specBtn) specBtn.style.display = "none"; if (invBtn) invBtn.style.display = "none";
            }
        }

        window.takeMarker = function(k) { if (currentWriters[k] === "") set(ref(db, `${ID_LEZIONE}/token_${k}`), { id: mySessionId, name: myUserName }); };
        window.releaseMarker = function(k) { if (currentWriters[k] === mySessionId) set(ref(db, `${ID_LEZIONE}/token_${k}`), null); };
        window.forceUnlock = function(k) { set(ref(db, `${ID_LEZIONE}/token_${k}`), null); };
        window.editBoard = function(k) { set(ref(db, `${ID_LEZIONE}/view_state_${k}`), { fixed: false }); };
        window.submitBoard = function(k) { if (currentWriters[k] === mySessionId) { set(ref(db, `${ID_LEZIONE}/view_state_${k}`), { fixed: true, author: myUserName }).then(() => { set(ref(db, `${ID_LEZIONE}/token_${k}`), null); }); } };
        window.clearBoard = function(k) { if (confirm("Cancellare lavagna?")) { set(ref(db, `${ID_LEZIONE}/token_${k}`), null); set(ref(db, `${ID_LEZIONE}/view_state_${k}`), { fixed: false, author: "" }); set(ref(db, `${ID_LEZIONE}/content_${k}`), { html: "" }).then(() => { if (boards[k]) boards[k].innerHTML = ""; }); } };

        ['fase_ascolto', 'fase_lettura'].forEach(fase => {
            onValue(ref(db, `${ID_LEZIONE}/stato_${fase}`), (snap) => {
                const isActive = snap.val() || false;
                const area = document.getElementById(`sezione-${fase}`); if (area && isActive) area.style.display = 'block';
                const btn = document.getElementById(`btn_${fase}`); if (btn) { btn.style.opacity = isActive ? '0.5' : '1'; btn.disabled = isActive; }
            });
        });

        // ==========================================
        // 5. LOGICA GIOCO FLASHCARD (Sincronizzata con Turni)
        // ==========================================
        if (ConfigLezione.elicitazione && ConfigLezione.elicitazione.gioco) {
            window.currentRound = 0; 
            window.correctOption = 1;
            
            // Variabili per gestire chi sta giocando in questo momento
            let gameTokenWriter = "";
            let gameTokenName = "";
            let currentSelection = null;
            let isConfirmed = false;

            const nodeGameState = ref(db, `${ID_LEZIONE}/game_state`);
            const nodeGameToken = ref(db, `${ID_LEZIONE}/game_token`);

            // 1. Ascoltiamo chi ha prenotato il turno
            onValue(nodeGameToken, (snap) => {
                const data = snap.val();
                if (data) { gameTokenWriter = data.id; gameTokenName = data.name; } 
                else { gameTokenWriter = ""; gameTokenName = ""; }
                aggiornaUIGioco();
            });

            // 2. Ascoltiamo lo stato del gioco (round, parola cliccata, conferma)
            onValue(nodeGameState, (snap) => {
                const data = snap.val() || { round: 0, selezione: null, confermato: false };
                window.currentRound = data.round;
                currentSelection = data.selezione;
                isConfirmed = data.confermato;

                window.loadGameRound(); // Ricarica l'immagine e i testi
                aggiornaSelezioneVisiva(); // Colora i tasti
                aggiornaUIGioco(); // Mostra/nasconde il tasto conferma
            });

            window.loadGameRound = function() {
                const gameImgEl = document.getElementById('game-main-img');
                if (!gameImgEl) return;

                if (window.currentRound >= ConfigLezione.elicitazione.gioco.length) {
                    gameImgEl.style.display = 'none';
                    document.getElementById('game-btn-1').style.display = 'none';
                    document.getElementById('game-btn-2').style.display = 'none';
                    document.getElementById('game-feedback').innerHTML = "🎉 Bravissimi! Gioco Finito.";
                    return;
                }

                const rd = ConfigLezione.elicitazione.gioco[window.currentRound];
                gameImgEl.src = rd.img;
                gameImgEl.style.display = 'inline-block';
                document.getElementById('game-audio').src = rd.audio;

                // Trucco matematico per mischiare le parole in modo uguale per tutti gli schermi
                window.correctOption = (window.currentRound % 2 === 0) ? 1 : 2;

                if (window.correctOption === 1) {
                    document.getElementById('game-btn-1').innerText = rd.parolaC;
                    document.getElementById('game-btn-2').innerText = rd.parolaS;
                } else {
                    document.getElementById('game-btn-1').innerText = rd.parolaS;
                    document.getElementById('game-btn-2').innerText = rd.parolaC;
                }
            };

            // Funzioni richiamate dai pulsanti HTML
            window.playGameAudio = function() { document.getElementById('game-audio').play(); };

            window.prendiControlloGioco = function() {
                if (gameTokenWriter === "") set(nodeGameToken, { id: mySessionId, name: myUserName });
            };

            window.selezionaParola = function(sel) {
                // Solo chi ha prenotato il turno può cliccare, e solo se non ha ancora confermato
                if (gameTokenWriter === mySessionId && !isConfirmed) {
                    set(nodeGameState, { round: window.currentRound, selezione: sel, confermato: false });
                }
            };

            window.confermaSceltaGioco = function() {
                if (gameTokenWriter === mySessionId && currentSelection !== null) {
                    set(nodeGameState, { round: window.currentRound, selezione: currentSelection, confermato: true });
                    // Rilasciamo il turno in automatico dopo 2 secondi
                    setTimeout(() => { set(nodeGameToken, null); }, 2000);
                }
            };

            window.nextGameRound = function() {
                const nextRound = (window.currentRound + 1) % ConfigLezione.elicitazione.gioco.length;
                set(nodeGameState, { round: nextRound, selezione: null, confermato: false });
                set(nodeGameToken, null); // Assicuriamoci che il turno sia libero per la nuova parola
            };

            // Funzioni grafiche interne
            function aggiornaSelezioneVisiva() {
                const b1 = document.getElementById('game-btn-1'); const b2 = document.getElementById('game-btn-2');
                const feedback = document.getElementById('game-feedback');
                if (!b1 || !b2) return;

                b1.style.borderColor = "#cbd5e0"; b1.style.backgroundColor = "white"; b1.style.color = "#2c3e50";
                b2.style.borderColor = "#cbd5e0"; b2.style.backgroundColor = "white"; b2.style.color = "#2c3e50";
                feedback.innerHTML = "";

                if (currentSelection !== null) {
                    const btnSelez = document.getElementById(`game-btn-${currentSelection}`);
                    btnSelez.style.borderColor = "#3498db"; btnSelez.style.backgroundColor = "#eaf2f8";

                    if (isConfirmed) {
                        if (currentSelection === window.correctOption) {
                            btnSelez.style.borderColor = "#2ecc71"; btnSelez.style.backgroundColor = "#2ecc71"; btnSelez.style.color = "white";
                            feedback.innerHTML = "✅ Esatto!"; feedback.style.color = "#27ae60";
                        } else {
                            btnSelez.style.borderColor = "#e74c3c"; btnSelez.style.backgroundColor = "#e74c3c"; btnSelez.style.color = "white";
                            const btnCorretto = document.getElementById(`game-btn-${window.correctOption}`);
                            btnCorretto.style.borderColor = "#2ecc71"; btnCorretto.style.borderWidth = "4px";
                            feedback.innerHTML = "❌ Sbagliato!"; feedback.style.color = "#c0392b";
                        }
                    }
                }
            }

            function aggiornaUIGioco() {
                const status = document.getElementById('game-status-bar'); const btnGioca = document.getElementById('btn-gioca');
                const b1 = document.getElementById('game-btn-1'); const b2 = document.getElementById('game-btn-2');
                const btnConferma = document.getElementById('game-conferma-btn');
                if (!status) return;

                if (isConfirmed) {
                    status.innerHTML = "Round terminato 🏁"; status.className = "status-badge";
                    btnGioca.style.display = "none"; btnConferma.style.display = "none";
                    b1.style.pointerEvents = "none"; b2.style.pointerEvents = "none";
                    return;
                }

                if (gameTokenWriter === "") {
                    status.innerHTML = "Libero 🟢"; status.className = "status-badge status-reading";
                    btnGioca.style.display = "inline-block"; btnConferma.style.display = "none";
                    b1.style.pointerEvents = "none"; b2.style.pointerEvents = "none";
                } else if (gameTokenWriter === mySessionId) {
                    status.innerHTML = "Tocca a te! ✍️"; status.className = "status-badge status-writing";
                    btnGioca.style.display = "none"; 
                    b1.style.pointerEvents = "auto"; b2.style.pointerEvents = "auto";
                    btnConferma.style.display = currentSelection !== null ? "block" : "none";
                } else {
                    status.innerHTML = `⏳ Sceglie ${gameTokenName}...`; status.className = "status-badge";
                    btnGioca.style.display = "none"; btnConferma.style.display = "none";
                    b1.style.pointerEvents = "none"; b2.style.pointerEvents = "none";
                }
            }
        }
    
    </script>
</body>
</html>
