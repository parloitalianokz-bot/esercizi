<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unità 10 — Rispondi alle domande (Esercizio G)</title>
  <style>
    :root {
      color-scheme: light;
      font-family: 'Segoe UI', Inter, system-ui, -apple-system, sans-serif;
      --primary: #6556bd;
      --primary-light: #f0edff;
      --primary-dark: #4c3e99;
      --accent: #ffb703;
      --bg-main: #f7f6fb;
      --card-bg: #ffffff;
      --text: #24213a;
      --text-muted: #68667a;
      --success: #20a16b;
      --success-bg: #d9f4e8;
      --border: #ebe9f2;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 16px;
      background:
        radial-gradient(ellipse at 50% -12%, rgba(155, 142, 240, .24), transparent 42%),
        var(--bg-main);
      color: var(--text);
    }

    .container { width: min(100%, 760px); margin: 0 auto; }

    .hero { margin: 8px 0 28px; text-align: center; }
    .eyebrow {
      display: inline-block;
      color: var(--primary);
      font-size: .8rem;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      background: var(--primary-light);
      padding: 7px 14px;
      border-radius: 20px;
      margin-bottom: 8px;
      box-shadow: inset 0 0 0 1px rgba(101, 86, 189, .08);
    }
    h1 {
      margin: 4px 0;
      font-size: clamp(2rem, 5vw, 2.6rem);
      letter-spacing: -.03em;
      color: var(--primary-dark);
      line-height: 1.15;
    }
    .hero-subtitle {
      margin: 8px 0 0;
      color: var(--text-muted);
      font-size: .98rem;
    }

    /* Barra controlli superiore */
    .top-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-start;
      gap: 12px;
      margin-bottom: 24px;
      padding: 14px 20px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--card-bg);
      box-shadow: 0 6px 18px rgba(50, 38, 94, .04);
    }
    .teacher-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
    }
    .teacher-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: .88rem;
      color: var(--text);
      cursor: pointer;
      font-weight: 600;
      user-select: none;
    }
    .teacher-toggle input { accent-color: var(--primary); }
    
    button.reset-btn {
      padding: 6px 14px;
      border: 1px solid #fca5a5;
      border-radius: 10px;
      background: #fff;
      color: #dc2626;
      font: inherit;
      font-size: .8rem;
      font-weight: 700;
      cursor: pointer;
      min-height: 42px;
    }
    button.reset-btn:hover { background: #fef2f2; }

    /* Card Esercizio */
    .card {
      padding: clamp(20px, 4vw, 32px);
      border: 1px solid var(--border);
      border-radius: 26px;
      background: var(--card-bg);
      box-shadow: 0 20px 55px rgba(50, 38, 94, .08);
    }

    .question-box {
      position: relative;
      overflow: hidden;
      padding: 22px;
      margin-bottom: 22px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: #fff;
      transition: all .25s ease;
      box-shadow: 0 5px 16px rgba(50, 38, 94, .035);
    }
    .question-box.active {
      border-color: #8b7ce0;
      background: linear-gradient(145deg, #fff 55%, #faf9ff);
      box-shadow: 0 0 0 3px rgba(101, 86, 189, .11), 0 10px 24px rgba(50, 38, 94, .06);
    }
    .question-box.active::before,
    .question-box.approved::before {
      position: absolute;
      inset: 0 auto 0 0;
      width: 5px;
      background: var(--primary);
      content: "";
    }
    .question-box.approved::before { background: var(--success); }
    .question-box.locked { background: #fbfaff; opacity: .7; }
    .question-box.approved {
      border-color: #d1fae5;
      background: #f0fdf4;
    }

    .question-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 14px;
    }
    .question-title {
      min-width: 0;
      font-weight: 700;
      font-size: 1.05rem;
      line-height: 1.4;
      display: flex;
      align-items: flex-start;
      color: var(--text);
    }
    .number {
      display: inline-grid;
      width: 36px;
      height: 36px;
      place-items: center;
      margin-right: 12px;
      border-radius: 12px;
      background: var(--primary-light);
      color: var(--primary);
      font-size: .95rem;
      font-weight: 800;
      flex-shrink: 0;
    }
    .badge {
      font-size: .75rem;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 8px;
      text-transform: uppercase;
      letter-spacing: .015em;
      flex-shrink: 0;
    }
    .badge-locked { background: #e5e7eb; color: #6b7280; }
    .badge-active { background: #ffe4e6; color: #e11d48; }
    .badge-writing { background: #fef3c7; color: #d97706; }
    .badge-approved { background: var(--success-bg); color: #047857; }

    /* Textarea per le risposte */
    textarea.answer-input {
      width: 100%;
      min-height: 64px;
      padding: 12px 14px;
      border: 1.5px solid #d9d3ed;
      border-radius: 12px;
      font: inherit;
      font-size: 1rem;
      line-height: 1.5;
      resize: vertical;
      outline: none;
      background: #fff;
      transition: border-color .15s, box-shadow .15s;
    }
    textarea.answer-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(101, 86, 189, 0.15);
    }
    textarea.answer-input:disabled {
      background: #f2f0f8;
      border-color: #e1deeb;
      color: #334155;
      cursor: not-allowed;
    }

    /* Controlli Token */
    .token-controls {
      margin-top: 10px;
      display: flex;
      justify-content: flex-start;
      align-items: center;
    }
    .btn-token {
      background: var(--accent);
      color: #24213a;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 700;
      font-size: .85rem;
      cursor: pointer;
      min-height: 42px;
      transition: background 0.2s;
    }
    .btn-token:hover { background: #e0a200; }
    .btn-token.release {
      background: #e2e8f0;
      color: #475569;
    }

    /* Azione Unica Insegnante */
    .teacher-action {
      margin-top: 16px;
      display: flex;
      justify-content: flex-end;
    }
    .btn-approve {
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 12px;
      font-weight: 700;
      max-width: 100%;
      line-height: 1.4;
      font-size: .9rem;
      cursor: pointer;
      min-height: 42px;
      box-shadow: 0 4px 12px rgba(101, 86, 189, 0.2);
      transition: transform 0.15s, background 0.2s;
    }
    .btn-approve:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    @media (max-width: 520px) {
      body { padding: 16px 8px; }
      .top-controls { flex-direction: column; align-items: flex-start; }
      .teacher-controls { width: 100%; justify-content: space-between; }
      .card { padding: 18px 14px; border-radius: 20px; }
      .question-box { padding: 16px 13px; border-radius: 16px; }
      .question-title { font-size: .98rem; }
      .badge { font-size: .68rem; padding: 5px 7px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>

  <main class="container">
    <header class="hero">
      <span class="eyebrow">Unità 10 · Domande e Colori</span>
      <h1>Ответьте на вопросы</h1>
      <p class="hero-subtitle">Rispondi alle domande dell'esercizio G</p>
    </header>

    <!-- Barra Controlli Superiore -->
    <div id="status" class="top-controls">
      <div class="teacher-controls">
        <label class="teacher-toggle">
          <input type="checkbox" id="teacher-mode">
          Режим учителя · Modalità insegnante
        </label>
        <button id="reset" class="reset-btn" type="button" style="display:none;">⚠️ Сбросить · Azzera</button>
      </div>
    </div>

    <!-- Card dell'Esercizio -->
    <section class="card">
      <form id="answers" autocomplete="off"></form>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "INSERISCI_API_KEY",
      authDomain: "esercizi-parlo-italiano.firebaseapp.com",
      databaseURL: "https://esercizi-parlo-italiano-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "esercizi-parlo-italiano",
      appId: "INSERISCI_APP_ID"
    };

    const questions = [
      "Di che colore è la neve?",
      "Di che colore sono le nuvole?",
      "Di che colore sono i limoni?",
      "Di che colore è il legno?",
      "Di che colore è il cielo?",
      "Di che colore sono le fragole?",
      "Di che colore è il caffè?",
      "Di che colore sono gli zucchini?",
      "Di che colore sono i pomodori?",
      "Di che colore è l’insalata?",
      "Di che colore sono i kiwi?",
      "Di che colore sono le ciliegie?",
      "Di che colore è il mare?",
      "Di che colore sono le rose rosse?"
    ];

    const myClientId = "user_" + Math.random().toString(36).substring(2, 9);

    const form = document.getElementById("answers");
    const teacherToggle = document.getElementById("teacher-mode");
    const resetButton = document.getElementById("reset");

    let answersRef = null;
    let currentActiveStep = -1;
    let currentWriter = null;
    let isTeacher = false;

    const questionBoxes = [];
    const badges = [];

    questions.forEach((qText, qIdx) => {
      const row = document.createElement("div");
      row.className = "question-box locked";
      row.id = `question-${qIdx}`;

      const header = document.createElement("div");
      header.className = "question-header";

      const title = document.createElement("div");
      title.className = "question-title";
      title.innerHTML = `<span class="number">${qIdx + 1}</span><span>${qText}</span>`;

      const badge = document.createElement("span");
      badge.className = "badge badge-locked";
      badge.textContent = "Закрыта · Bloccata";

      header.append(title, badge);

      const input = document.createElement("textarea");
      input.id = `answer-input-${qIdx}`;
      input.className = "answer-input";
      input.rows = 2;
      input.disabled = true;
      input.placeholder = "In attesa dell'insegnante · Ждём, пока учитель откроет блок...";

      input.addEventListener("input", () => {
        if (answersRef && currentActiveStep === qIdx && currentWriter === myClientId) {
          answersRef.child("responses").child(String(qIdx)).set(input.value);
        }
      });

      // Controlli Token (Prendi/Lascia parola)
      const tokenDiv = document.createElement("div");
      tokenDiv.className = "token-controls";
      tokenDiv.style.display = "none";

      const tokenBtn = document.createElement("button");
      tokenBtn.className = "btn-token";
      tokenBtn.type = "button";
      tokenBtn.textContent = "✋ Взять слово · Prendi la parola";
      tokenBtn.onclick = () => {
        if (answersRef && currentActiveStep === qIdx) {
          if (currentWriter === myClientId) {
            answersRef.child("currentWriter").set(null);
          } else if (!currentWriter) {
            answersRef.child("currentWriter").set(myClientId);
          }
        }
      };

      tokenDiv.appendChild(tokenBtn);

      // Pulsante Azione Docente
      const actionDiv = document.createElement("div");
      actionDiv.className = "teacher-action";
      actionDiv.style.display = "none";

      const actionBtn = document.createElement("button");
      actionBtn.className = "btn-approve";
      actionBtn.type = "button";
      actionBtn.textContent = "🔓 Открыть блок · Sblocca Blocco";
      actionBtn.onclick = () => {
        if (answersRef) {
          if (currentActiveStep === qIdx) {
            answersRef.update({
              activeStep: qIdx + 1,
              currentWriter: null
            });
          } else {
            answersRef.update({
              activeStep: qIdx,
              currentWriter: null
            });
          }
        }
      };

      actionDiv.appendChild(actionBtn);
      row.append(header, input, tokenDiv, actionDiv);

      form.appendChild(row);
      questionBoxes.push(row);
      badges.push(badge);
    });

    teacherToggle.addEventListener("change", (e) => {
      isTeacher = e.target.checked;
      resetButton.style.display = isTeacher ? "inline-block" : "none";
      updateUIState();
    });

    let currentResponsesData = {};

    function updateUIState() {
      questionBoxes.forEach((box, i) => {
        const badge = badges[i];
        const input = box.querySelector("textarea.answer-input");
        const tokenDiv = box.querySelector(".token-controls");
        const tokenBtn = box.querySelector(".btn-token");
        const actionDiv = box.querySelector(".teacher-action");
        const actionBtn = box.querySelector(".btn-approve");

        box.classList.remove("active", "locked", "approved");

        if (i < currentActiveStep) {
          // Blocco Approvato
          box.classList.add("approved");
          badge.className = "badge badge-approved";
          badge.textContent = "Одобрено · Approvata";
          input.disabled = true;
          tokenDiv.style.display = "none";
          actionDiv.style.display = "none";
        } else if (i === currentActiveStep) {
          // Blocco Attivo (Sbloccato)
          box.classList.add("active");

          if (!currentWriter) {
            badge.className = "badge badge-active";
            badge.textContent = "Открыто · In corso";
            input.disabled = true;
            input.placeholder = "Напишите ответ · Scrivi la risposta";

            tokenDiv.style.display = "flex";
            tokenBtn.textContent = "✋ Взять слово · Prendi la parola";
            tokenBtn.className = "btn-token";
            tokenBtn.disabled = false;
          } else if (currentWriter === myClientId) {
            badge.className = "badge badge-writing";
            badge.textContent = "Вы пишете · Stai scrivendo";
            input.disabled = false;
            input.placeholder = "Напишите ответ · Scrivi la risposta";

            tokenDiv.style.display = "flex";
            tokenBtn.textContent = "✔ Передать слово · Lascia la parola";
            tokenBtn.className = "btn-token release";
            tokenBtn.disabled = false;
          } else {
            badge.className = "badge badge-writing";
            badge.textContent = "Пишет одноклассник · Un compagno sta scrivendo";
            input.disabled = true;
            input.placeholder = "Пишет одноклассник · Un compagno sta scrivendo";

            tokenDiv.style.display = "flex";
            tokenBtn.textContent = "🔒 Пишет одноклассник · Un compagno sta scrivendo";
            tokenBtn.className = "btn-token release";
            tokenBtn.disabled = true;
          }

          if (isTeacher) {
            actionDiv.style.display = "flex";
            actionBtn.textContent = "✔️ Одобрить и открыть следующий · Approva e apri il successivo ➔";
          } else {
            actionDiv.style.display = "none";
          }
        } else {
          // Blocco Bloccato
          box.classList.add("locked");
          badge.className = "badge badge-locked";
          badge.textContent = "Закрыта · Bloccata";
          input.disabled = true;
          input.placeholder = "In attesa dell'insegnante · Ждём, пока учитель откроет блок...";
          tokenDiv.style.display = "none";

          if (isTeacher && i === currentActiveStep + 1) {
            actionDiv.style.display = "flex";
            actionBtn.textContent = i === 0
              ? "🔓 Открыть первый блок · Sblocca il primo blocco"
              : "🔓 Открыть этот блок · Sblocca questo blocco";
          } else {
            actionDiv.style.display = "none";
          }
        }
      });
    }

    if (window.firebase) {
      try {
        firebase.initializeApp(firebaseConfig);
        answersRef = firebase.database().ref("esercizi/unita10-domande-g-struttura-c");

        answersRef.on("value", (snapshot) => {
          const data = snapshot.val() || {};
          currentResponsesData = data.responses || {};

          currentActiveStep = (data.activeStep !== undefined) ? data.activeStep : -1;
          currentWriter = data.currentWriter || null;

          questionBoxes.forEach((box, qIdx) => {
            const input = box.querySelector("textarea.answer-input");
            const responseVal = currentResponsesData[qIdx] || "";

            if (currentWriter !== myClientId) {
              input.value = responseVal;
            }
          });

          updateUIState();
        });
      } catch (e) {
        console.error("Errore Firebase:", e);
      }
    }

    resetButton.addEventListener("click", () => {
      if (confirm("Сбросить все ответы и снова заблокировать упражнение? · Vuoi azzerare tutte le risposte e bloccare nuovamente l'esercizio?")) {
        answersRef.set({
          activeStep: -1,
          currentWriter: null,
          responses: {}
        });
      }
    });
  </script>
</body>
</html>
