<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Componi le frasi — Lo zio Gustavo</title>
  <style>
    :root {
      color-scheme: light;
      font-family: 'Segoe UI', Inter, system-ui, -apple-system, sans-serif;
      --primary: #6556bd;
      --primary-light: #f0edff;
      --primary-dark: #4c3e99;
      --accent: #ffb703;
      --bg-main: #f7f6fb;
      --card-bg: #ffffff;
      --text: #24213a;
      --text-muted: #68667a;
      --success: #20a16b;
      --success-bg: #d9f4e8;
      --border: #ebe9f2;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 16px;
      background: radial-gradient(ellipse at 10% 0%, #e9e5ff 0%, transparent 50%),
                  radial-gradient(ellipse at 90% 100%, #f0edff 0%, transparent 50%),
                  var(--bg-main);
      color: var(--text);
    }

    .container { width: min(100%, 820px); margin: 0 auto; }

    .hero { margin-bottom: 20px; text-align: center; }
    .eyebrow {
      display: inline-block;
      color: var(--primary);
      font-size: .8rem;
      font-weight: 800;
      letter-spacing: .15em;
      text-transform: uppercase;
      background: var(--primary-light);
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 8px;
    }
    h1 {
      margin: 4px 0;
      font-size: clamp(2rem, 5vw, 2.6rem);
      letter-spacing: -.03em;
      color: var(--text);
    }

    /* Barra controlli superiore */
    .top-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 24px;
      padding: 14px 20px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--card-bg);
      box-shadow: 0 10px 25px rgba(50, 38, 94, 0.03);
    }
    .status-indicator {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text-muted);
      font-weight: 600;
      font-size: .9rem;
    }
    .status-indicator::before {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #aaa6b8;
      content: "";
      transition: background 0.3s;
    }
    .top-controls.connected .status-indicator::before {
      background: var(--success);
      box-shadow: 0 0 0 3px var(--success-bg);
    }
    .teacher-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .teacher-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: .88rem;
      color: var(--text-muted);
      cursor: pointer;
      font-weight: 600;
      user-select: none;
    }
    
    button.reset-btn {
      padding: 6px 14px;
      border: 1px solid #fca5a5;
      border-radius: 10px;
      background: #fff;
      color: #dc2626;
      font: inherit;
      font-size: .8rem;
      font-weight: 700;
      cursor: pointer;
    }
    button.reset-btn:hover { background: #fef2f2; }

    /* Box dell'Esempio */
    .example-card {
      background: linear-gradient(135deg, #ffffff 0%, #fcfaff 100%);
      border: 1px solid var(--border);
      border-left: 6px solid var(--primary);
      border-radius: 18px;
      padding: 18px 24px;
      margin-bottom: 24px;
      box-shadow: 0 8px 20px rgba(101, 86, 189, 0.04);
    }
    .example-card h3 {
      margin: 0 0 6px 0;
      color: var(--primary-dark);
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    .example-text {
      font-size: 1.1rem;
      color: var(--text);
      font-weight: 600;
    }
    .example-text span {
      color: var(--primary);
    }

    /* Card Esercizio */
    .card {
      padding: clamp(20px, 4vw, 32px);
      border: 1px solid var(--border);
      border-radius: 24px;
      background: var(--card-bg);
      box-shadow: 0 16px 40px rgba(50, 38, 94, 0.05);
    }
    .card-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    h2 { margin: 0; font-size: 1.25rem; }
    .progress-badge {
      background: var(--primary-light);
      color: var(--primary);
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: 700;
      font-size: .85rem;
    }

    /* Elementi dell'Esercizio */
    .item-box {
      padding: 20px;
      margin-bottom: 18px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: #fff;
      transition: all .25s ease;
    }
    .item-box.active {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(101, 86, 189, 0.12);
      background: #ffffff;
    }
    .item-box.locked {
      opacity: .5;
      background: #fafafc;
    }
    .item-box.approved {
      border-color: #d1fae5;
      background: #f0fdf4;
    }

    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .item-title {
      font-weight: 700;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
    }
    .number {
      display: inline-grid;
      width: 30px;
      height: 30px;
      place-items: center;
      margin-right: 12px;
      border-radius: 10px;
      background: var(--primary-light);
      color: var(--primary);
      font-size: .9rem;
      font-weight: 800;
      flex-shrink: 0;
    }
    .badge {
      font-size: .75rem;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 8px;
      text-transform: uppercase;
    }
    .badge-locked { background: #e5e7eb; color: #6b7280; }
    .badge-active { background: #ffe4e6; color: #e11d48; }
    .badge-approved { background: var(--success-bg); color: #047857; }

    textarea {
      display: block;
      width: 100%;
      min-height: 56px;
      resize: vertical;
      padding: 12px 14px;
      border: 1.5px solid #d1d5db;
      border-radius: 12px;
      outline: none;
      font: inherit;
      font-size: 1rem;
      line-height: 1.45;
      transition: border-color .15s, box-shadow .15s;
    }
    textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(101, 86, 189, 0.15);
    }
    textarea:disabled {
      background: #f3f4f6;
      color: #374151;
      cursor: not-allowed;
    }

    .teacher-action {
      margin-top: 12px;
      display: flex;
      justify-content: flex-end;
    }
    .btn-approve {
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: 700;
      font-size: .9rem;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(101, 86, 189, 0.2);
      transition: transform 0.15s, background 0.2s;
    }
    .btn-approve:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    @media (max-width: 520px) {
      body { padding: 16px 8px; }
      .top-controls { flex-direction: column; align-items: flex-start; }
      .teacher-controls { width: 100%; justify-content: space-between; }
    }
  </style>
</head>
<body>

  <main class="container">
    <header class="hero">
      <span class="eyebrow">Italiano · Produzione Scritta</span>
      <h1>Составьте предложения по образцу</h1>
    </header>

    <!-- Barra Controlli Superiore -->
    <div id="status" class="top-controls">
      <span class="status-indicator">Esercizio Collaborativo</span>
      <div class="teacher-controls">
        <label class="teacher-toggle">
          <input type="checkbox" id="teacher-mode">
          Modalità Insegnante
        </label>
        <button id="reset" class="reset-btn" type="button" style="display:none;">⚠️ Resetta</button>
      </div>
    </div>

    <!-- Box dell'Esempio -->
    <section class="example-card">
      <h3>💡 Образец (Esempio)</h3>
      <div class="example-text">
        Borsa ➔ <span>Nella borsa ci sono le chiavi.</span>
      </div>
    </section>

    <!-- Card dell'Esercizio -->
    <section class="card">
      <div class="card-heading">
        <h2>Componi le frasi</h2>
        <span id="progress-badge" class="progress-badge">0 di 14</span>
      </div>

      <form id="answers" autocomplete="off"></form>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script>
    // CONFIGURAZIONE FIREBASE
    const firebaseConfig = {
      apiKey: "INSERISCI_API_KEY",
      authDomain: "esercizi-parlo-italiano.firebaseapp.com",
      databaseURL: "https://esercizi-parlo-italiano-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "esercizi-parlo-italiano",
      appId: "INSERISCI_APP_ID"
    };

    // Lista delle parole guida per la composizione
    const items = [
      "Frigorifero",
      "Armadio",
      "Cassetto",
      "Borsa",
      "Tavola",
      "Pavimento",
      "Televisione",
      "Comodino",
      "Divano",
      "Letto",
      "Libreria",
      "Scrivania",
      "Piatto",
      "Bottiglia"
    ];

    const form = document.getElementById("answers");
    const statusDiv = document.getElementById("status");
    const progressBadge = document.getElementById("progress-badge");
    const teacherToggle = document.getElementById("teacher-mode");
    const resetButton = document.getElementById("reset");

    let answersRef = null;
    let currentActiveStep = -1;
    let isTeacher = false;
    const inputs = [];
    const itemBoxes = [];
    const badges = [];

    items.forEach((word, index) => {
      const row = document.createElement("div");
      row.className = "item-box locked";
      row.id = `box-${index}`;

      const header = document.createElement("div");
      header.className = "item-header";

      const title = document.createElement("div");
      title.className = "item-title";
      title.innerHTML = `<span class="number">${index + 1}</span>${word}`;

      const badge = document.createElement("span");
      badge.className = "badge badge-locked";
      badge.textContent = "Bloccata";

      header.append(title, badge);

      const input = document.createElement("textarea");
      input.id = `answer-${index}`;
      input.rows = 2;
      input.disabled = true;
      input.placeholder = "In attesa dell'insegnante…";

      // Salvataggio in tempo reale su Firebase
      input.addEventListener("input", () => {
        if (answersRef && currentActiveStep === index) {
          answersRef.child("responses").child(String(index)).set(input.value);
        }
      });

      const actionDiv = document.createElement("div");
      actionDiv.className = "teacher-action";
      actionDiv.style.display = "none";

      const approveBtn = document.createElement("button");
      approveBtn.className = "btn-approve";
      approveBtn.type = "button";
      approveBtn.textContent = index === 0 ? "🔓 Sblocca Punto 1" : "Approva e sblocca successiva ➔";
      approveBtn.onclick = () => {
        if (answersRef) {
          answersRef.child("activeStep").set(index === currentActiveStep ? index + 1 : index);
        }
      };

      actionDiv.appendChild(approveBtn);
      row.append(header, input, actionDiv);
      form.appendChild(row);

      inputs.push(input);
      itemBoxes.push(row);
      badges.push(badge);
    });

    teacherToggle.addEventListener("change", (e) => {
      isTeacher = e.target.checked;
      resetButton.style.display = isTeacher ? "inline-block" : "none";
      updateUIState();
    });

    function updateUIState() {
      itemBoxes.forEach((box, i) => {
        const input = inputs[i];
        const badge = badges[i];
        const actionDiv = box.querySelector(".teacher-action");
        const btn = box.querySelector(".btn-approve");

        box.classList.remove("active", "locked", "approved");

        if (i < currentActiveStep) {
          box.classList.add("approved");
          badge.className = "badge badge-approved";
          badge.textContent = "Approvata";
          input.disabled = true;
          actionDiv.style.display = "none";
        } else if (i === currentActiveStep) {
          box.classList.add("active");
          badge.className = "badge badge-active";
          badge.textContent = "In corso";
          input.disabled = false;
          input.placeholder = "Scrivi la frase qui…";
          
          if (isTeacher) {
            actionDiv.style.display = "flex";
            btn.textContent = "Approva e sblocca successiva ➔";
          } else {
            actionDiv.style.display = "none";
          }
        } else {
          box.classList.add("locked");
          badge.className = "badge badge-locked";
          badge.textContent = "Bloccata";
          input.disabled = true;
          input.placeholder = "In attesa dell'insegnante…";
          
          if (isTeacher && i === currentActiveStep + 1) {
            actionDiv.style.display = "flex";
            btn.textContent = i === 0 ? "🔓 Sblocca Punto 1" : "🔓 Sblocca questo punto";
          } else {
            actionDiv.style.display = "none";
          }
        }
      });

      const completedCount = Math.max(0, currentActiveStep);
      progressBadge.textContent = `${Math.min(completedCount, items.length)} di ${items.length}`;
    }

    if (window.firebase) {
      try {
        firebase.initializeApp(firebaseConfig);
        // Nodo separato per questo esercizio
        answersRef = firebase.database().ref("esercizi/frasi-gustavo");

        answersRef.on("value", (snapshot) => {
          const data = snapshot.val() || {};
          const responses = data.responses || {};
          
          currentActiveStep = (data.activeStep !== undefined) ? data.activeStep : -1;

          inputs.forEach((input, index) => {
            if (document.activeElement !== input) {
              input.value = responses[index] || "";
            }
          });

          updateUIState();
          statusDiv.classList.add("connected");
        });
      } catch (e) {
        console.error("Errore Firebase:", e);
      }
    }

    resetButton.addEventListener("click", () => {
      if (confirm("Vuoi azzerare tutte le risposte e bloccare nuovamente l'esercizio?")) {
        answersRef.set({
          activeStep: -1,
          responses: {}
        });
      }
    });
  </script>
</body>
</html>
