<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Esercizio Preposizioni — Lo zio Gustavo</title>
  <style>
    :root {
      color-scheme: light;
      font-family: 'Segoe UI', Inter, system-ui, -apple-system, sans-serif;
      --primary: #008C45; /* Verde per cambiare tema mantenendo eleganza */
      --primary-light: #e6f4ed;
      --primary-dark: #006b35;
      --bg-main: #f7f9f8;
      --card-bg: #ffffff;
      --text: #24213a;
      --text-muted: #68667a;
      --success: #20a16b;
      --success-bg: #d9f4e8;
      --border: #e1e8e4;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 16px;
      background: radial-gradient(ellipse at 10% 0%, #e6f4ed 0%, transparent 50%),
                  radial-gradient(ellipse at 90% 100%, #f0f7f3 0%, transparent 50%),
                  var(--bg-main);
      color: var(--text);
    }

    .container { width: min(100%, 820px); margin: 0 auto; }

    .hero { margin-bottom: 20px; text-align: center; }
    .eyebrow {
      display: inline-block;
      color: var(--primary);
      font-size: .8rem;
      font-weight: 800;
      letter-spacing: .15em;
      text-transform: uppercase;
      background: var(--primary-light);
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 8px;
    }
    h1 {
      margin: 4px 0;
      font-size: clamp(2rem, 5vw, 2.6rem);
      letter-spacing: -.03em;
      color: var(--text);
    }

    /* Barra controlli superiore */
    .top-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 24px;
      padding: 14px 20px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--card-bg);
      box-shadow: 0 10px 25px rgba(0, 140, 69, 0.04);
    }
    .status-indicator {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text-muted);
      font-weight: 600;
      font-size: .9rem;
    }
    .status-indicator::before {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #aaa6b8;
      content: "";
      transition: background 0.3s;
    }
    .top-controls.connected .status-indicator::before {
      background: var(--success);
      box-shadow: 0 0 0 3px var(--success-bg);
    }
    .teacher-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .teacher-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: .88rem;
      color: var(--text-muted);
      cursor: pointer;
      font-weight: 600;
      user-select: none;
    }
    
    button.reset-btn {
      padding: 6px 14px;
      border: 1px solid #fca5a5;
      border-radius: 10px;
      background: #fff;
      color: #dc2626;
      font: inherit;
      font-size: .8rem;
      font-weight: 700;
      cursor: pointer;
    }
    button.reset-btn:hover { background: #fef2f2; }

    /* Card Esercizio */
    .card {
      padding: clamp(20px, 4vw, 32px);
      border: 1px solid var(--border);
      border-radius: 24px;
      background: var(--card-bg);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.04);
    }
    .card-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    h2 { margin: 0; font-size: 1.25rem; }
    .progress-badge {
      background: var(--primary-light);
      color: var(--primary);
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: 700;
      font-size: .85rem;
    }

    /* Frasi dell'esercizio */
    .phrase-box {
      padding: 20px;
      margin-bottom: 18px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: #fff;
      transition: all .25s ease;
      line-height: 2.2;
      font-size: 1.05rem;
    }
    .phrase-box.active {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(0, 140, 69, 0.12);
      background: #ffffff;
    }
    .phrase-box.locked {
      opacity: .5;
      background: #fafafc;
    }
    .phrase-box.approved {
      border-color: #d1fae5;
      background: #f0fdf4;
    }

    .phrase-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      line-height: 1;
    }
    .number {
      display: inline-grid;
      width: 30px;
      height: 30px;
      place-items: center;
      border-radius: 10px;
      background: var(--primary-light);
      color: var(--primary);
      font-size: .9rem;
      font-weight: 800;
    }
    .badge {
      font-size: .75rem;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 8px;
      text-transform: uppercase;
    }
    .badge-locked { background: #e5e7eb; color: #6b7280; }
    .badge-active { background: #ffe4e6; color: #e11d48; }
    .badge-approved { background: var(--success-bg); color: #047857; }

    /* Stile Input Preposizioni inline */
    input.prep-input {
      display: inline-block;
      width: 100px;
      padding: 4px 8px;
      margin: 0 4px;
      border: 1.5px solid #bdc7c1;
      border-radius: 8px;
      font: inherit;
      font-size: 1rem;
      font-weight: 600;
      color: var(--primary-dark);
      text-align: center;
      background: #fcfdfe;
      transition: border-color .15s, box-shadow .15s;
    }
    input.prep-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(0, 140, 69, 0.15);
      outline: none;
      background: #fff;
    }
    input.prep-input:disabled {
      background: #eef2f0;
      border-color: #d1d8d4;
      color: #334155;
      cursor: not-allowed;
    }

    .teacher-action {
      margin-top: 14px;
      display: flex;
      justify-content: flex-end;
    }
    .btn-approve {
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: 700;
      font-size: .9rem;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(0, 140, 69, 0.2);
      transition: transform 0.15s, background 0.2s;
    }
    .btn-approve:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    @media (max-width: 520px) {
      body { padding: 16px 8px; }
      .top-controls { flex-direction: column; align-items: flex-start; }
      .teacher-controls { width: 100%; justify-content: space-between; }
      input.prep-input { width: 80px; }
    }
  </style>
</head>
<body>

  <main class="container">
    <header class="hero">
      <span class="eyebrow">Italiano · Grammatica</span>
      <h1>Completa con le preposizioni</h1>
    </header>

    <!-- Barra Controlli Superiore -->
    <div id="status" class="top-controls">
      <span class="status-indicator">Esercizio Collaborativo</span>
      <div class="teacher-controls">
        <label class="teacher-toggle">
          <input type="checkbox" id="teacher-mode">
          Modalità Insegnante
        </label>
        <button id="reset" class="reset-btn" type="button" style="display:none;">⚠️ Resetta</button>
      </div>
    </div>

    <!-- Card dell'Esercizio -->
    <section class="card">
      <div class="card-heading">
        <h2>Inserisci le preposizioni corrette</h2>
        <span id="progress-badge" class="progress-badge">0 di 15</span>
      </div>

      <form id="answers" autocomplete="off"></form>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script>
    // CONFIGURAZIONE FIREBASE
    const firebaseConfig = {
      apiKey: "INSERISCI_API_KEY",
      authDomain: "esercizi-parlo-italiano.firebaseapp.com",
      databaseURL: "https://esercizi-parlo-italiano-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "esercizi-parlo-italiano",
      appId: "INSERISCI_APP_ID"
    };

    // Struttura delle frasi con segnaposto [input] dove vanno inserite le preposizioni
    const phrases = [
      "___ mia casa c’è un grande ordine, tutte le cose si trovano ___ posti più normali. I miei vestiti per esempio sono ___ vasca ___ bagno, le scarpe sono ___ tavoli, i libri e i giornali sono ___ pavimento.",
      "Accanto ___ letto, ___ comodino, c’è un bellissimo cactus, e naturalmente ___ sala ___ pranzo, ___ tavola, c’è una bicicletta.",
      "I fiori non sono ___ vasi, è chiaro, ma sono ___ cassetti ___ scrivania, perché lì stanno molto meglio.",
      "I soldi non sono ___ portafoglio, ma ___ frigorifero, così sono più freschi.",
      "L’ombrello non è ___ portaombrelli, ma è ___ caminetto, che è il posto ideale ___ l’ombrello.",
      "I libri sono ___ pavimento, e ___ libreria ci sono le bottiglie vuote.",
      "Il telefono è ___ secchio ___ spazzatura, e ___ scrivania ci sono le mie scarpe sporche.",
      "Io dormo ___ tappeto, perché ___ letto c’è un grande cactus.",
      "Il mio cane dorme ___ armadio e lo zio Augusto, quando resta da me ___ la notte, dorme ___ pianoforte.",
      "Anche ___ cucina tutto è in ordine. Lì ci sono solo cose nuove e utili. Lo zucchero invece è ___ tasche ___ cappotto, il sale è ___ borsa, le patate sono ___ corridoio e l’olio è ___ salotto.",
      "___ borsa, a parte il sale, ci sono anche tre palle ___ tennis, il sapone e la mia collezione ___ francobolli.",
      "La borsa ___ solito sta sotto il letto, insieme ___ cappotto.",
      "La domenica io e lo zio Augusto andiamo ___ giardino ___ cercare il tesoro ___ pirati.",
      "Scaviamo una bella buca profonda due metri, e poi, quando siamo stanchi, rientriamo ___ casa e ci sediamo ___ pavimento.",
      "Guardiamo un po’ la radio, fumiamo un giornale e beviamo una bella tazza ___ olio; e la sera, ___ cena, polpette ___ cactus ___ tutti!"
    ];

    const form = document.getElementById("answers");
    const statusDiv = document.getElementById("status");
    const progressBadge = document.getElementById("progress-badge");
    const teacherToggle = document.getElementById("teacher-mode");
    const resetButton = document.getElementById("reset");

    let answersRef = null;
    let currentActiveStep = -1;
    let isTeacher = false;
    const phraseBoxes = [];
    const badges = [];

    // Rendering dinamico delle frasi e degli input inline
    phrases.forEach((phraseText, phraseIdx) => {
      const row = document.createElement("div");
      row.className = "phrase-box locked";
      row.id = `phrase-${phraseIdx}`;

      const header = document.createElement("div");
      header.className = "phrase-header";

      const numSpan = document.createElement("span");
      numSpan.className = "number";
      numSpan.textContent = phraseIdx + 1;

      const badge = document.createElement("span");
      badge.className = "badge badge-locked";
      badge.textContent = "Bloccata";

      header.append(numSpan, badge);
      row.appendChild(header);

      // Sostituisce "___" con campi <input>
      const parts = phraseText.split("___");
      const contentSpan = document.createElement("span");

      parts.forEach((part, inputIdx) => {
        contentSpan.appendChild(document.createTextNode(part));
        
        if (inputIdx < parts.length - 1) {
          const input = document.createElement("input");
          input.type = "text";
          input.className = "prep-input";
          input.dataset.phrase = phraseIdx;
          input.dataset.input = inputIdx;
          input.disabled = true;

          input.addEventListener("input", () => {
            if (answersRef && currentActiveStep === phraseIdx) {
              answersRef.child("responses").child(String(phraseIdx)).child(String(inputIdx)).set(input.value);
            }
          });

          contentSpan.appendChild(input);
        }
      });

      row.appendChild(contentSpan);

      // Pulsante Azione Insegnante
      const actionDiv = document.createElement("div");
      actionDiv.className = "teacher-action";
      actionDiv.style.display = "none";

      const approveBtn = document.createElement("button");
      approveBtn.className = "btn-approve";
      approveBtn.type = "button";
      approveBtn.textContent = phraseIdx === 0 ? "🔓 Sblocca Frase 1" : "Approva e sblocca successiva ➔";
      approveBtn.onclick = () => {
        if (answersRef) {
          answersRef.child("activeStep").set(phraseIdx === currentActiveStep ? phraseIdx + 1 : phraseIdx);
        }
      };

      actionDiv.appendChild(approveBtn);
      row.appendChild(actionDiv);

      form.appendChild(row);
      phraseBoxes.push(row);
      badges.push(badge);
    });

    teacherToggle.addEventListener("change", (e) => {
      isTeacher = e.target.checked;
      resetButton.style.display = isTeacher ? "inline-block" : "none";
      updateUIState();
    });

    function updateUIState() {
      phraseBoxes.forEach((box, i) => {
        const badge = badges[i];
        const inputs = box.querySelectorAll("input.prep-input");
        const actionDiv = box.querySelector(".teacher-action");
        const btn = box.querySelector(".btn-approve");

        box.classList.remove("active", "locked", "approved");

        if (i < currentActiveStep) {
          box.classList.add("approved");
          badge.className = "badge badge-approved";
          badge.textContent = "Approvata";
          inputs.forEach(inp => inp.disabled = true);
          actionDiv.style.display = "none";
        } else if (i === currentActiveStep) {
          box.classList.add("active");
          badge.className = "badge badge-active";
          badge.textContent = "In corso";
          inputs.forEach(inp => inp.disabled = false);

          if (isTeacher) {
            actionDiv.style.display = "flex";
            btn.textContent = "Approva e sblocca successiva ➔";
          } else {
            actionDiv.style.display = "none";
          }
        } else {
          box.classList.add("locked");
          badge.className = "badge badge-locked";
          badge.textContent = "Bloccata";
          inputs.forEach(inp => inp.disabled = true);

          if (isTeacher && i === currentActiveStep + 1) {
            actionDiv.style.display = "flex";
            btn.textContent = i === 0 ? "🔓 Sblocca Frase 1" : "🔓 Sblocca questa frase";
          } else {
            actionDiv.style.display = "none";
          }
        }
      });

      const completedCount = Math.max(0, currentActiveStep);
      progressBadge.textContent = `${Math.min(completedCount, phrases.length)} di ${phrases.length}`;
    }

    if (window.firebase) {
      try {
        firebase.initializeApp(firebaseConfig);
        // Salviamo in un percorso separato sul DB per non sovrascrivere l'altro esercizio
        answersRef = firebase.database().ref("esercizi/preposizioni-gustavo");

        answersRef.on("value", (snapshot) => {
          const data = snapshot.val() || {};
          const responses = data.responses || {};

          currentActiveStep = (data.activeStep !== undefined) ? data.activeStep : -1;

          // Aggiorna gli input mantenendo la posizione del cursore se l'utente sta digitando
          phraseBoxes.forEach((box, pIdx) => {
            const inputs = box.querySelectorAll("input.prep-input");
            const phraseData = responses[pIdx] || {};

            inputs.forEach((input, iIdx) => {
              if (document.activeElement !== input) {
                input.value = phraseData[iIdx] || "";
              }
            });
          });

          updateUIState();
          statusDiv.classList.add("connected");
        });
      } catch (e) {
        console.error("Errore Firebase:", e);
      }
    }

    resetButton.addEventListener("click", () => {
      if (confirm("Vuoi azzerare tutte le risposte e bloccare nuovamente l'esercizio?")) {
        answersRef.set({
          activeStep: -1,
          responses: {}
        });
      }
    });
  </script>
</body>
</html>
