<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f5f3ff" />
  <title>Comprensione — Lo zio Gustavo</title>
  <style>
    :root {
      color-scheme: light;
      font-family: 'Segoe UI', Inter, system-ui, -apple-system, sans-serif;
      --primary: #6556bd;
      --primary-light: #f0edff;
      --bg-main: #f7f6fb;
      --text: #24213a;
      --text-muted: #68667a;
      --success: #20a16b;
      --success-bg: #d9f4e8;
      --border: #ebe9f2;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 16px;
      background: radial-gradient(ellipse at 12% 0%, #e9e5ff 0, transparent 40%), var(--bg-main);
      color: var(--text);
    }
    .container { width: min(100%, 780px); margin: 0 auto; }
    .hero { margin-bottom: 20px; text-align: center; }
    .eyebrow { color: var(--primary); font-size: .8rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 6px 0; font-size: clamp(2rem, 5vw, 2.6rem); letter-spacing: -.03em; }
    
    /* Barra Superiore controlli e stato */
    .top-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 16px 0 24px;
      padding: 14px 18px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: #fff;
      font-size: .88rem;
      box-shadow: 0 4px 12px rgba(50, 38, 94, 0.03);
    }
    .status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      font-weight: 600;
    }
    .status-indicator::before {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #aaa6b8;
      content: "";
      transition: background 0.3s;
    }
    .top-controls.connected .status-indicator::before {
      background: var(--success);
      box-shadow: 0 0 0 3px var(--success-bg);
    }
    .teacher-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .teacher-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: .85rem;
      color: var(--text-muted);
      cursor: pointer;
      font-weight: 600;
    }
    button.reset-btn {
      padding: 6px 12px;
      border: 1px solid #fca5a5;
      border-radius: 8px;
      background: #fff;
      color: #dc2626;
      font: inherit;
      font-size: .8rem;
      font-weight: 700;
      cursor: pointer;
    }
    button.reset-btn:hover { background: #fef2f2; }
    
    .card {
      padding: clamp(20px, 4vw, 32px);
      border: 1px solid var(--border);
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 16px 40px rgba(50, 38, 94, 0.05);
    }
    .card-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    h2 { margin: 0; font-size: 1.25rem; }
    .progress-badge {
      background: var(--primary-light);
      color: var(--primary);
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: 700;
      font-size: .85rem;
    }

    .question {
      padding: 20px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: #fff;
      transition: all .2s ease;
    }
    .question.active {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(101, 86, 189, 0.15);
      background: #ffffff;
    }
    .question.locked {
      opacity: .5;
      background: #fafafc;
    }
    .question.approved {
      border-color: #d1fae5;
      background: #f0fdf4;
    }

    .question-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    label { font-weight: 650; font-size: 1rem; line-height: 1.4; display: flex; align-items: center; }
    .number {
      display: inline-grid;
      width: 28px;
      height: 28px;
      place-items: center;
      margin-right: 10px;
      border-radius: 8px;
      background: var(--primary-light);
      color: var(--primary);
      font-size: .85rem;
      font-weight: 800;
      flex-shrink: 0;
    }
    .badge {
      font-size: .75rem;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      text-transform: uppercase;
    }
    .badge-locked { background: #e5e7eb; color: #6b7280; }
    .badge-active { background: #ffe4e6; color: #e11d48; }
    .badge-approved { background: var(--success-bg); color: #047857; }

    textarea {
      display: block;
      width: 100%;
      min-height: 60px;
      resize: vertical;
      padding: 12px 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      outline: none;
      font: inherit;
      line-height: 1.45;
      transition: border-color .15s;
    }
    textarea:focus { border-color: var(--primary); }
    textarea:disabled { background: #f3f4f6; color: #374151; cursor: not-allowed; }

    .teacher-action {
      margin-top: 12px;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
    .btn-approve {
      background: var(--primary);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-approve:hover { opacity: .9; }

    @media (max-width: 520px) {
      body { padding: 16px 8px; }
      .top-controls { flex-direction: column; align-items: flex-start; }
      .teacher-controls { width: 100%; justify-content: space-between; }
    }
  </style>
</head>
<body>

  <main class="container">
    <header class="hero">
      <div class="eyebrow">Italiano · Comprensione Guidata</div>
      <h1>Lo zio Gustavo</h1>
    </header>

    <!-- BARRA CONTROLLI SUPERIORE -->
    <div id="status" class="top-controls">
      <span class="status-indicator">Esercizio Collaborativo</span>
      
      <div class="teacher-controls">
        <label class="teacher-toggle">
          <input type="checkbox" id="teacher-mode">
          Modalità Insegnante
        </label>
        <button id="reset" class="reset-btn" type="button" style="display:none;">⚠️ Resetta</button>
      </div>
    </div>

    <section class="card">
      <div class="card-heading">
        <h2>Rispondi insieme alla classe</h2>
        <span id="progress-badge" class="progress-badge">0 di 15</span>
      </div>

      <form id="answers" autocomplete="off"></form>
    </section>
  </main>
